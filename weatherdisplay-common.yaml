                  grid_cell_row_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  bg_color: ${clr_card}
                  border_width: 0
                  radius: 10
                  pad_left: 10
                  pad_right: 10
                  pad_top: 8
                  pad_bottom: 8
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_cross: CENTER
                  widgets:
                    - label:
                        text: "Vejrudsigt"
                        text_color: ${clr_text}
                        text_font: font_sm
                        pad_bottom: 2
                    - obj:
