# ============================================================
# Weather Display — Shared Layout
# Included by both weatherdisplay-sdl.yaml and weatherdisplay.yaml
#
# Contains: fonts, LVGL page layout
# Assumes: a display with id: lvgl_display exists in the host file
# ============================================================

# ---------------------------------------------------------------------------
# Color palette — edit hex values here to change the display theme
# ---------------------------------------------------------------------------
substitutions:
  clr_bg:        "0x000000"   # screen / lvgl background
  clr_card:      "0x1C2130"   # card background
  clr_separator: "0x2A3348"   # card separator line + status bar border
  clr_text:      "0xFFFFFF"   # primary text
  clr_text_dim:  "0x7788AA"   # dim labels (sensor sub-labels etc.)
  clr_wifi_good: "0x4CAF50"   # green  — WiFi strong / good (≥ −67 dBm)
  clr_wifi_weak: "0xFFA726"   # amber  — WiFi weak (−80 to −67 dBm)
  clr_wifi_bad:  "0xF44336"   # red    — WiFi low / disconnected (< −80 dBm)

# ---------------------------------------------------------------------------
# Fonts
# ---------------------------------------------------------------------------
font:
  - file: "gfonts://Roboto"
    id: font_xs
    size: 11
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°æøåÆØÅ"
  - file: "gfonts://Roboto"
    id: font_sm
    size: 14
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°æøåÆØÅ"
  - file: "gfonts://Roboto"
    id: font_md
    size: 18
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°æøåÆØÅ"
  - file: "gfonts://Roboto"
    id: font_lg
    size: 22
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°æøåÆØÅ"
  - file: "gfonts://Roboto"
    id: font_xl
    size: 32
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°æøåÆØÅ"
  - file: "gfonts://Roboto"
    id: font_xxl
    size: 48
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°æøåÆØÅ"

  # MDI icon font
  # F092F wifi · F005D arrow-up · F0045 arrow-down · F050F thermometer
  # F0564 water · F0599 weather-sunny · F0597 weather-rainy · F059D weather-windy
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: mdi_sm
    size: 18
    bpp: 4
    glyphs: "\U000F091F\U000F0922\U000F0925\U000F0928\U000F092B\U000F092F\U000F005D\U000F0045\U000F050F\U000F0564\U000F0599\U000F0597\U000F059D"
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: mdi_md
    size: 24
    bpp: 4
    glyphs: "\U000F091F\U000F0922\U000F0925\U000F0928\U000F092B\U000F092F\U000F005D\U000F0045\U000F050F\U000F0564\U000F0599\U000F0597\U000F059D"

# ---------------------------------------------------------------------------
# Time — updates lbl_time every minute using C stdlib time()
# SDL: uses macOS system clock directly (always correct)
# Hardware: accurate after homeassistant time component syncs the system clock
# ---------------------------------------------------------------------------
interval:
  - interval: 60s
    then:
      - lvgl.label.update:
          id: lbl_time
          text: !lambda |-
            time_t now = ::time(nullptr);
            struct tm *t = localtime(&now);
            char buf[6];
            strftime(buf, sizeof(buf), "%H:%M", t);
            return std::string(buf);

# ---------------------------------------------------------------------------
# LVGL — page layout (display id resolved from host file)
# ---------------------------------------------------------------------------
lvgl:
  displays:
    - lvgl_display
  color_depth: 16
  bg_color: ${clr_bg}
  default_font: font_sm

  pages:
    - id: main_page
      bg_color: ${clr_bg}

      widgets:

        # ==============================================================
        # STATUS BAR  (full width, 44 px)
        # WiFi icon · title · time
        # ==============================================================
        - obj:
            id: status_bar
            x: 0
            y: 0
            width: 800
            height: 44
            bg_color: ${clr_bg}
            border_side: BOTTOM
            border_color: ${clr_separator}
            border_width: 1
            radius: 0
            pad_all: 0

            widgets:
              - label:
                  id: lbl_wifi
                  text: "\U000F092B"
                  text_font: mdi_md
                  align: LEFT_MID
                  x: 10
                  text_color: ${clr_wifi_bad}
              - label:
                  id: lbl_title
                  text: "Vejret i Holmeenegen"
                  align: CENTER
                  text_color: ${clr_text}
                  text_font: font_lg
              - label:
                  id: lbl_time
                  text: "07:44"
                  align: RIGHT_MID
                  x: -10
                  text_color: ${clr_text}
                  text_font: font_lg

        # ==============================================================
        # GRID CONTAINER  3×3
        # 6 px gap between cards; black background shows through as border
        # Card layout: x=6  y=50  w=788  h=424
        # Rows: FR(2) · FR(2) · FR(1) — top two rows ~2× height of bottom
        # ==============================================================
        - obj:
            id: grid_container
            x: 6
            y: 50
            width: 788
            height: 424
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            layout:
              type: GRID
              grid_columns: [FR(1), FR(1), FR(1)]
              grid_rows: [FR(2), FR(2), FR(1)]
              pad_column: 6
              pad_row: 6

            widgets:

              # ──────────────────────── Row 0 ────────────────────────

              - obj:
                  id: card_temperature
                  grid_cell_column_pos: 0
                  grid_cell_row_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  bg_color: ${clr_card}
                  border_width: 0
                  radius: 10
                  pad_left: 10
                  pad_right: 10
                  pad_top: 8
                  pad_bottom: 8
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_cross: CENTER
                  widgets:
                    - label:
                        text: "Temperatur"
                        text_color: ${clr_text}
                        text_font: font_sm
                        pad_bottom: 2
                    - obj:
                        width: 230
                        height: 1
                        border_width: 0
                        bg_color: ${clr_separator}
                        pad_all: 0

              - obj:
                  id: card_wind
                  grid_cell_column_pos: 1
                  grid_cell_row_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  bg_color: ${clr_card}
                  border_width: 0
                  radius: 10
                  pad_left: 10
                  pad_right: 10
                  pad_top: 8
                  pad_bottom: 8
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_cross: CENTER
                  widgets:
                    - label:
                        text: "Vind"
                        text_color: ${clr_text}
                        text_font: font_sm
                        pad_bottom: 2
                    - obj:
                        width: 230
                        height: 1
                        border_width: 0
                        bg_color: ${clr_separator}
                        pad_all: 0

              - obj:
