substitutions:
  name: "Weather Display"
  device: "esphome-weather-sdl"
  version: "0.1.0"
  created_by: "Bjarne Riis"
  display_rotation: "0" # 0, 90, 180, 270

esphome:
  name: "${device}"
  friendly_name: "${name}"
  project:
    name: "briis.${device}"
    version: "${version}"

host:

logger:
  level: INFO

display:
  - platform: sdl
    id: lvgl_display
    dimensions:
      width: 800
      height: 480
    update_interval: 16ms

packages:
  common: !include weather-common.yaml