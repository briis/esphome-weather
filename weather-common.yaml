# ---------------------------------------------------------------------------
# Scripts
# ---------------------------------------------------------------------------
script:
  - id: lvgl_update_clock
    then:
      - lvgl.label.update:
          id: time_label
          text: !lambda |-
            auto n = id(system_time).now();
            if (!n.is_valid()) return std::string("--:--");
            char b[8];
            snprintf(b, sizeof(b), "%02d:%02d", n.hour, n.minute);
            return std::string(b);

# ---------------------------------------------------------------------------
# LVGL — page layout (display id resolved from host file)
# ---------------------------------------------------------------------------
lvgl:
  displays:
    - lvgl_display
  touchscreens:
    - touch_controller    
  color_depth: 16
  rotation: ${display_rotation}
  buffer_size: 100%
  full_refresh: true
  default_font: font_sm
  ### THEME ###
  theme:
    label:
      text_color: "${clr_text}"
      text_align: CENTER

  ### STYLES ###
  style_definitions:
    - id: grid_layout
      width: 100%
      height: 100%
      x: 0
      y: 0
      radius: 0      
      bg_color: ${clr_bg}
      pad_all: 0
      pad_left: 5
      pad_right: 5
      border_opa: TRANSP
    - id: grid_layout_nested
      width: 100%
      height: 100%
      x: 0
      y: 0
      radius: 0      
      bg_color: ${clr_card}
      pad_all: 0
      pad_left: 5
      pad_right: 5
      border_opa: TRANSP
    - id: widget_4x1
      width: 256 # Col: 64px
      height: 39 # Row: 39px
      x: 0
      y: 0
      radius: 5
      bg_color: ${clr_card}
      pad_all: 0
      border_opa: TRANSP
      grid_cell_x_align: CENTER
      grid_cell_y_align: CENTER
    - id: widget_4x2
      width: 256 # Col: 64px
      height: 78 # Row: 39px
      x: 0
      y: 0
      radius: 5
      bg_color: ${clr_card}
      pad_all: 0
      border_opa: TRANSP
      grid_cell_x_align: CENTER
      grid_cell_y_align: CENTER
    - id: widget_4x3
      width: 256 # Col: 64px
      height: 117 # Row: 39px
      x: 0
      y: 0
      radius: 5
      bg_color: ${clr_card}
      pad_all: 0
      border_opa: TRANSP
      grid_cell_x_align: CENTER
      grid_cell_y_align: CENTER
    - id: widget_4x4
      width: 256 # Col: 64px
      height: 156 # Row: 39px
      x: 0
      y: 0
      radius: 5
      bg_color: ${clr_card}
      pad_all: 0
      border_opa: TRANSP
      grid_cell_x_align: CENTER
      grid_cell_y_align: CENTER
    - id: widget_4x5
      width: 256 # Col: 64px
      height: 195 # Row: 39px
      x: 0
      y: 0
      radius: 5
      bg_color: ${clr_card}
      pad_all: 0
      border_opa: TRANSP
      grid_cell_x_align: CENTER
      grid_cell_y_align: CENTER
  
  pages:
  - id: main_page
    bg_color: ${clr_bg}
    pad_all: 0
    skip: false
    widgets:
      - obj:
          align: CENTER
          id: main_grid
          styles: grid_layout
          layout:
            type: grid
            grid_columns: [fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1)]
            grid_rows: [fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1)]
            grid_column_align: CENTER
            grid_row_align: CENTER
            pad_row: 5
            pad_column: 5
          widgets:
            - obj:
                styles: widget_4x1
                bg_color: ${clr_bg}
                grid_cell_column_pos: 0
                grid_cell_row_pos: 0
                grid_cell_column_span: 4
                grid_cell_row_span: 1
                grid_cell_x_align: START
                radius: 0
                widgets:
                  - label:
                      id: wifi_label
                      align: LEFT_MID
                      text_color: ${clr_wifi_bad}
                      text_font: mdi_sm
                      text: "\U000F092B"
            - obj:
                styles: widget_4x1
                bg_color: ${clr_bg}
                grid_cell_column_pos: 4
                grid_cell_row_pos: 0
                grid_cell_column_span: 4
                grid_cell_row_span: 1
                radius: 0
                widgets:
                  - label:
                      id: display_heder
                      align: CENTER
                      text_color: ${clr_text}
                      text_font: font_md
                      text: "${header_title}"
            - obj:
                styles: widget_4x1
                bg_color: ${clr_bg}
                grid_cell_column_pos: 8
                grid_cell_row_pos: 0
                grid_cell_column_span: 4
                grid_cell_row_span: 1
                radius: 0
                widgets:
                  - label:
                      id: time_label
                      align: RIGHT_MID
                      text_color: ${clr_text}
                      text: "00:00"
            - obj:
                styles: widget_4x5
                bg_color: ${clr_card}
                grid_cell_column_pos: 0
                grid_cell_row_pos: 1
                grid_cell_column_span: 4
                grid_cell_row_span: 5
                widgets:
                  - label:
                      align: TOP_RIGHT
                      x: -5
                      y: 5
                      text_font: mdi_sm
                      text: "\U000F0510"
                      text_color: ${clr_text}
                  - label:
                      align: TOP_MID
                      x: -25
                      y: 35
                      text: "\U000F005D"
                      text_font: mdi_sm
                      text_color: ${clr_temp_hot}
                  - label:
                      align: TOP_MID
                      x: 5
                      y: 35
                      id: lbl_temp_high
                      text: "--°"
                      text_color: ${clr_text}
                      text_font: font_md
                  - meter:
                      id: circle_temp
                      align: CENTER
                      width: 180
                      height: 180
                      bg_opa: TRANSP
                      border_width: 6
                      border_color: ${clr_temp_cold}
                      indicator:
                        bg_opa: TRANSP
                        border_width: 0                      
                      scales:
                        range_from: 0
                        range_to: 360
                        angle_range: 360
                        rotation: 270
                  - label:
                      id: lbl_temp_current
                      align: CENTER
                      text_color: ${clr_text}
                      text_font: font_xxl
                      text: "--,-°"
                  - label:
                      align: BOTTOM_MID
                      x: -25
                      y: -35
                      text: "\U000F0045"
                      text_font: mdi_sm
                      text_color: ${clr_temp_cold}
                  - label:
                      align: BOTTOM_MID
                      x: 5
                      y: -35
                      id: lbl_temp_low
                      text: "--°"
                      text_color: ${clr_text}
                      text_font: font_md
            # Wind Widget
            - obj:
                styles: widget_4x5
                bg_color: ${clr_card}
                grid_cell_column_pos: 4
                grid_cell_row_pos: 1
                grid_cell_column_span: 4
                grid_cell_row_span: 5
                widgets: 
                  # Header labels
                  - label:
                      align: TOP_RIGHT
                      x: -5
                      y: 5
                      text_font: mdi_sm
                      text: "\U000F059D"
                      text_color: ${clr_text}
                  - meter:
                      id: circle_wind_border
                      align: CENTER
                      width: 180
                      height: 180
                      bg_opa: TRANSP
                      border_width: 3
                      border_color: ${clr_wind_circle}
                      pad_all: 0
                      indicator:
                        bg_opa: TRANSP
                        border_width: 0                      
                      scales:
                        range_from: 0
                        range_to: 360
                        angle_range: 360
                        rotation: 270
                        indicators:
                          - image:
                              id: bearing_indicator
                              src: bearing_img
                              pivot_x: 0 
                              pivot_y: 12
                              value: 0
                          - image:
                              id: bearing_avg_indicator
                              src: bearing_avg_img
                              pivot_x: 0 
                              pivot_y: 9
                              value: 0
                        ticks:
                          count: 17
                          color: ${clr_tick}
                          length: 6
                          radial_offset: 0
                          major:
                            stride: 4
                            length: 10
                            width: 3
                            color: ${clr_text}
                            label_gap: 6
                            radial_offset: 0
                  - label:
                      align: TOP_MID
                      y: 35
                      id: lbl_wind_cardinal
                      text: "---"
                      text_color: ${clr_text}
                      text_font: font_md
                  - label:
                      id: lbl_wind_speed
                      align: CENTER
                      text_color: ${clr_text}
                      text_font: font_xxl
                      text: "__,_"
                  - label:
                      align: BOTTOM_MID
                      y: -48
                      id: lbl_wind_gust
                      text: "--,-"
                      text_color: ${clr_text_dim}
                      text_font: font_md
                  - label:
                      align: BOTTOM_MID
                      y: -30
                      text: "m/s"
                      text_color: ${clr_text}
                      text_font: font_sm
            # Rain Widget
            - obj:
                styles: widget_4x5
                bg_color: ${clr_card}
                grid_cell_column_pos: 8
                grid_cell_row_pos: 1
                grid_cell_column_span: 4
                grid_cell_row_span: 5
                widgets: 
                  # Header labels
                  - label:
                      align: TOP_RIGHT
                      x: -5
                      y: 5
                      text_font: mdi_sm
                      text: "\U000F0596"
                      text_color: ${clr_text}
                  - meter:
                      id: circle_rain
                      align: CENTER
                      width: 180
                      height: 180
                      bg_opa: TRANSP
                      border_width: 6
                      border_color: ${clr_temp_cold}
                      indicator:
                        bg_opa: TRANSP
                        border_width: 0                      
                      scales:
                        range_from: 0
                        range_to: 360
                        angle_range: 360
                        rotation: 270
                      widgets:
                        - label:
                            align: TOP_MID
                            y: 2
                            text_font: font_sm
                            text_color: "${clr_text_dim}"
                            text: "I går:"
                        - label:
                            id: lbl_rain_yesterday
                            align: TOP_MID
                            y: 20
                            text_font: font_md
                            text_color: "${clr_text}"
                            text: "--,-"
                        - label:
                            id: rain_today
                            align: CENTER
                            text_font: font_xxl
                            text: "--,-"
                        - label:
                            id: lbl_rain_rate
                            align: BOTTOM_MID
                            y: -30
                            recolor: true
                            text_font: font_sm
                            text_color: "${clr_text}"
                            text: "--,- #7788AA mm/t#"
                        - label:
                            align: BOTTOM_MID
                            y: -2
                            text_font: font_sm
                            text_color: "${clr_text}"
                            text_align: RIGHT
                            text: "mm"
            # Temperatur Additional Data — tap to toggle vs. lightning data
            - obj:
                styles: widget_4x2
                bg_color: ${clr_card}
                grid_cell_column_pos: 0
                grid_cell_row_pos: 6
                grid_cell_column_span: 4
                grid_cell_row_span: 2
                on_click:
                  - lambda: |-
                      if (lv_obj_has_flag(id(additional_lightning_grid), LV_OBJ_FLAG_HIDDEN)) {
                        lv_obj_add_flag(id(additional_temp_grid), LV_OBJ_FLAG_HIDDEN);
                        lv_obj_clear_flag(id(additional_lightning_grid), LV_OBJ_FLAG_HIDDEN);
                      } else {
                        lv_obj_clear_flag(id(additional_temp_grid), LV_OBJ_FLAG_HIDDEN);
                        lv_obj_add_flag(id(additional_lightning_grid), LV_OBJ_FLAG_HIDDEN);
                      }
                widgets:
                  - obj:
                      id: additional_temp_grid
                      clickable: false
                      styles: grid_layout_nested
                      align: CENTER
                      layout:
                        type: grid
                        grid_columns: [fr(1), fr(1), fr(1)]
                        grid_rows: [fr(1), 2, fr(2)]
                        grid_column_align: CENTER
                        grid_row_align: CENTER
                      widgets:
                        - label:
                            grid_cell_x_align: CENTER
                            grid_cell_column_pos: 0
                            grid_cell_row_pos: 0
                            text_align: CENTER
                            text_font: font_sm
                            text_color: "${clr_text_dim}"
                            text: "Føles som"
                        - obj:
                            clickable: false
                            grid_cell_column_pos: 0
                            grid_cell_row_pos: 1
                            grid_cell_column_span: 3
                            grid_cell_x_align: STRETCH
                            height: 2
                            bg_color: "${clr_separator}"
                            pad_all: 0
                            border_width: 0
                        - label:
                            id: temp_feels_like
                            grid_cell_x_align: CENTER
                            grid_cell_y_align: START
                            grid_cell_column_pos: 0
                            grid_cell_row_pos: 2
                            text_align: CENTER
                            text_font: font_lg
                            text_color: "${clr_text}"
                            text: "--,-°"
                        - label:
                            grid_cell_x_align: CENTER
                            grid_cell_column_pos: 1
                            grid_cell_row_pos: 0
                            text_align: CENTER
                            text_font: font_sm
                            text_color: "${clr_text_dim}"
                            text: "Dugpunkt"
                        - label:
                            id: temp_dewpoint
                            grid_cell_x_align: CENTER
                            grid_cell_y_align: START
