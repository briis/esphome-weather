# ============================================================
# Weather Display — Shared Layout
# Included by both weatherdisplay-sdl.yaml and weatherdisplay.yaml
#
# Contains: fonts, LVGL page layout
# Assumes: a display with id: lvgl_display exists in the host file
# ============================================================

# ---------------------------------------------------------------------------
# Color palette — edit hex values here to change the display theme
# ---------------------------------------------------------------------------
substitutions:
  clr_bg:        "0x000000"   # screen / lvgl background
  clr_card:      "0x1C2130"   # card background
  clr_separator: "0x2A3348"   # card separator line + status bar border
  clr_text:      "0xFFFFFF"   # primary text
  clr_text_dim:  "0x7788AA"   # dim labels (sensor sub-labels etc.)
  clr_wifi_good: "0x4CAF50"   # green  — WiFi strong / good (≥ −67 dBm)
  clr_wifi_weak: "0xFFA726"   # amber  — WiFi weak (−80 to −67 dBm)
  clr_wifi_bad:  "0xF44336"   # red    — WiFi low / disconnected (< −80 dBm)

  # Temperature circle — color threshold based on current temperature
  clr_temp_cold: "0x2196F3"   # blue   — below 5°C
  clr_temp_cool: "0xFFC107"   # amber  — 5 to 14°C
  clr_temp_warm: "0xFF9800"   # orange — 15 to 19°C
  clr_temp_hot:  "0xF44336"   # red    — 20°C and above

  # Temperature entity / attributes — override in the target file (weatherdisplay.yaml)
  ha_temp_current: "sensor.unknown_temperature"
  ha_temp_high:    "max_temperature_today"
  ha_temp_low:     "min_temperature_today"

  # Wind sensor entity IDs — override in weatherdisplay.yaml
  ha_wind_speed:       "sensor.unknown_wind_speed"
  ha_wind_bearing:     "sensor.unknown_wind_bearing"
  ha_wind_gust:        "sensor.unknown_wind_gust"
  ha_wind_bearing_avg: "sensor.unknown_wind_bearing_avg"

