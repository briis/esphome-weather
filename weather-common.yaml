# ============================================================
# Weather Display — Shared Layout
# Included by both weatherdisplay-sdl.yaml and weatherdisplay.yaml
#
# Contains: fonts, LVGL page layout
# Assumes: a display with id: lvgl_display exists in the host file
# ============================================================

# ---------------------------------------------------------------------------
# Color palette — edit hex values here to change the display theme
# ---------------------------------------------------------------------------
substitutions:
  header_title:  "Vejret i Holmeengen" # Center Title
  clr_bg:        "0x000000"   # screen / lvgl background
  clr_card:      "0x1C2130"   # card background
  clr_separator: "0x2A3348"   # card separator line + status bar border
  clr_tick:      "0xE1E1E1"   # tick color for wind direction meter
  clr_text:      "0xFFFFFF"   # primary text
  clr_text_dim:  "0x7788AA"   # dim labels (sensor sub-labels etc.)
  clr_wifi_good: "0x4CAF50"   # green  — WiFi strong / good (≥ −67 dBm)
  clr_wifi_weak: "0xFFA726"   # amber  — WiFi weak (−80 to −67 dBm)
  clr_wifi_bad:  "0xF44336"   # red    — WiFi low / disconnected (< −80 dBm)

  # Temperature circle — color threshold based on current temperature
  clr_temp_cold: "0x2196F3"   # blue   — below 5°C
  clr_temp_cool: "0xFFC107"   # amber  — 5 to 14°C
  clr_temp_warm: "0xFF9800"   # orange — 15 to 19°C
  clr_temp_hot:  "0xF44336"   # red    — 20°C and above

  # Trend Symbols
  trend_rising:   "\U000F1594"  # Up Arrow  — rising
  trend_falling:  "\U000F1595"  # Down Arrow — falling
  trend_stable:   "\U000F1598"  # Horizontal Arrow — stable
  clr_trend_rising:   "0x4CAF50"   # green  — rising
  clr_trend_falling:  "0xF44336"   # red    — falling
  clr_trend_stable:   "0xE1E1E1"   # gray

  # Temperature entity / attributes — override in the target file (weatherdisplay.yaml)
  ha_temp_current: "sensor.unknown_temperature"
  ha_temp_high:    "max_temperature_today"
  ha_temp_low:     "min_temperature_today"
  ha_feels_like:   "sensor.unknown_apparent_temperature"
  ha_dew_point:    "sensor.unknown_dewpoint"
  ha_humidity:     "sensor.unknown_humidity"

  # Wind sensor entity IDs — override in weatherdisplay.yaml
  ha_wind_speed:       "sensor.unknown_wind_speed"
  ha_wind_bearing:     "sensor.unknown_wind_bearing"
  ha_wind_gust:        "sensor.unknown_wind_gust"
  ha_wind_bearing_avg: "sensor.unknown_wind_bearing_avg"
  clr_wind_circle:     "0xCEDD39"

  # UV & Solar Radiation — override in esphome-weather.yaml
  ha_uv_index:         "sensor.unknown_uv_index"
  ha_solar_radiation:  "sensor.unknown_solar_radiation"

  # Barometer - override in esphome-weather.yaml
  ha_pressure:         "sensor.unknown_pressure"
  ha_pressure_trend:   "sensor.unknown_pressure_trend"
  ha_pressure_trend_value: "sensor.unknown_pressure_trend_value"

  # Rain — override in esphome-weather.yaml
  ha_rain_today:       "sensor.unknown_rain_today"
  ha_rain_rate:        "sensor.unknown_rain_rate"
  ha_rain_yesterday:   "sensor.unknown_rain_yesterday"

  # Lightning — override in weatherdisplay.yaml
  ha_lightning_latest:    "sensor.unknown_lightning_latest"
  ha_lightning_strikes3h: "sensor.unknown_lightning_strikes3h"
  ha_lightning_distance:  "sensor.unknown_lightning_distance"

  # Forecast — override in weatherdisplay.yaml
  ha_fcast_condition:     "sensor.unknown_fcast_condition"
  ha_fcast_condition_txt: "sensor.unknown_fcast_condition_txt"
  ha_fcast_description:   "sensor.unknown_fcast_description"
  ha_fcst_temp_high:      "sensor.unknown_fcst_temp_high"
  ha_fcst_temp_low:       "sensor.unknown_fcst_temp_low"
  ha_fcst_precip_prob:    "sensor.unknown_fcst_precip_prob"
  ha_fcst_precipitation:  "sensor.unknown_fcst_precipitation"

  # AQI — override in weatherdisplay.yaml
  ha_aqi_index:  "sensor.unknown_aqi_index"
  ha_aqi_pm25:   "sensor.unknown_aqi_pm25"
  ha_aqi_pm10:   "sensor.unknown_aqi_pm10"

  # Sunrise - Sunset — override in weatherdisplay.yaml
  ha_sunrise:    "sensor.unknown_sunrise"
  ha_sunset:     "sensor.unknown_sunset"
  sym_sunrise:   "\U000F059C"
  sym_sunset:    "\U000F059B"
  
