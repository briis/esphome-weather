# ---------------------------------------------------------------------------
# Scripts
# ---------------------------------------------------------------------------
script:
  - id: lvgl_update_clock
    then:
      - lvgl.label.update:
          id: time_label
          text: !lambda |-
            auto n = id(system_time).now();
            if (!n.is_valid()) return std::string("--:--");
            char b[8];
            snprintf(b, sizeof(b), "%02d:%02d", n.hour, n.minute);
            return std::string(b);

  - id: lightning_popup_hide
    mode: restart
    then:
      - delay: 12s
      - lambda: |-
          lv_obj_add_flag(id(lightning_popup), LV_OBJ_FLAG_HIDDEN);

  # Forecast popup — opened by tapping the Forecast card. forecast_popup_fetch
  # is target-specific: weatherdisplay.yaml calls the real weather.get_forecasts
  # HA action; weatherdisplay-config-sdl.yaml fills in mock data instead (the
  # SDL build has no `api:`/HA connection at all).
  - id: forecast_popup_open
    then:
      - lambda: |-
          lv_obj_clear_flag(id(forecast_popup_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(forecast_popup), LV_OBJ_FLAG_HIDDEN);
      - script.execute: forecast_popup_fetch
      - script.execute: forecast_popup_auto_close

  - id: forecast_popup_close
    then:
      - script.stop: forecast_popup_auto_close
      - lambda: |-
          lv_obj_add_flag(id(forecast_popup_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(forecast_popup), LV_OBJ_FLAG_HIDDEN);

  # Safety-net auto-close: mode restart means every fresh open (or re-tap of
  # the Forecast card while already open) restarts the 2-minute countdown.
  # The hidden-flag check guards against a stray fire after a manual close.
  - id: forecast_popup_auto_close
    mode: restart
    then:
      - delay: 2min
      - lambda: |-
          if (!lv_obj_has_flag(id(forecast_popup), LV_OBJ_FLAG_HIDDEN)) {
            id(forecast_popup_close).execute();
          }

  # Parses a "HH:MM|temp|wind|precip%;..." string (up to 5 rows, semicolon
  # separated) into the 5 hourly forecast columns.
  # Parses "HH:MM|condition|temp|wind|bearing|precip%;..." (up to 5 rows) into
  # the 5 hourly forecast columns. Condition maps to the small img_sm_* icon
  # (same mapping as the main Forecast card's fimg_* toggle); bearing is
  # turned into a 16-point Danish cardinal (same table used for current wind).
  - id: forecast_popup_render_hourly
    parameters:
      data: string
    then:
      - lambda: |-
          static const char* cardinals[] = {"N","NNØ","NØ","ØNØ","Ø","ØSØ","SØ","SSØ","S","SSV","SV","VSV","V","VNV","NV","NNV"};
          lv_obj_t* time_lbl[5]   = { id(lbl_fh0_time),   id(lbl_fh1_time),   id(lbl_fh2_time),   id(lbl_fh3_time),   id(lbl_fh4_time) };
          lv_obj_t* icon_img[5]   = { id(img_fh0_cond),   id(img_fh1_cond),   id(img_fh2_cond),   id(img_fh3_cond),   id(img_fh4_cond) };
          lv_obj_t* temp_lbl[5]   = { id(lbl_fh0_temp),   id(lbl_fh1_temp),   id(lbl_fh2_temp),   id(lbl_fh3_temp),   id(lbl_fh4_temp) };
          lv_obj_t* wind_lbl[5]   = { id(lbl_fh0_wind),   id(lbl_fh1_wind),   id(lbl_fh2_wind),   id(lbl_fh3_wind),   id(lbl_fh4_wind) };
          lv_obj_t* precip_lbl[5] = { id(lbl_fh0_precip), id(lbl_fh1_precip), id(lbl_fh2_precip), id(lbl_fh3_precip), id(lbl_fh4_precip) };

          size_t pos = 0;
          int row = 0;
          while (row < 5 && pos <= data.size()) {
            size_t semi = data.find(';', pos);
            std::string token = (semi == std::string::npos) ? data.substr(pos) : data.substr(pos, semi - pos);
            if (token.empty()) break;

            std::string f[6];
            size_t fpos = 0;
            for (int i = 0; i < 6; i++) {
              size_t bar = token.find('|', fpos);
              f[i] = (bar == std::string::npos) ? token.substr(fpos) : token.substr(fpos, bar - fpos);
              fpos = (bar == std::string::npos) ? token.size() : bar + 1;
            }
            const std::string& cond = f[1];
            lv_obj_t* iw = icon_img[row];
            if      (cond == "clear-night")     lv_img_set_src(iw, id(img_sm_clear_night));
            else if (cond == "cloudy")          lv_img_set_src(iw, id(img_sm_cloudy));
            else if (cond == "fog")             lv_img_set_src(iw, id(img_sm_fog));
            else if (cond == "lightning")       lv_img_set_src(iw, id(img_sm_lightning));
            else if (cond == "lightning-rainy") lv_img_set_src(iw, id(img_sm_lightning_rainy));
            else if (cond == "partlycloudy")    lv_img_set_src(iw, id(img_sm_partlycloudy));
            else if (cond == "rainy")           lv_img_set_src(iw, id(img_sm_rainy));
            else if (cond == "snowy")           lv_img_set_src(iw, id(img_sm_snowy));
            else if (cond == "snowy-rainy")     lv_img_set_src(iw, id(img_sm_snowy_rainy));
            else if (cond == "windy")           lv_img_set_src(iw, id(img_sm_windy));
            else                                lv_img_set_src(iw, id(img_sm_clear_day));

            int bearing = atoi(f[4].c_str());
            std::string cardinal = cardinals[(int)((bearing + 11.25f) / 22.5f) % 16];

            lv_label_set_text(time_lbl[row], f[0].c_str());
            lv_label_set_text(temp_lbl[row], (f[2] + "°").c_str());
            lv_label_set_text(wind_lbl[row], (f[3] + " m/s " + cardinal).c_str());
            std::string precip = f[5];
            for (char& c : precip) if (c == '.') { c = ','; break; }
            lv_label_set_text(precip_lbl[row], (precip + " mm").c_str());

            row++;
            if (semi == std::string::npos) break;
            pos = semi + 1;
          }
          for (; row < 5; row++) {
            lv_img_set_src(icon_img[row], id(img_sm_clear_day));
            lv_label_set_text(time_lbl[row], "--:--");
            lv_label_set_text(temp_lbl[row], "--°");
            lv_label_set_text(wind_lbl[row], "-- m/s --");
            lv_label_set_text(precip_lbl[row], "-- mm");
          }

  # Parses "weekday(1-7)|condition|high|low|wind|bearing|precip_mm;..."
  # (up to 5 rows) into the 5 daily forecast columns. Weekday is ISO
  # (1=Mon..7=Sun) so the same digit works whether it came from HA's Jinja
  # %u or the SDL mock. Condition/bearing handled the same way as hourly.
  - id: forecast_popup_render_daily
    parameters:
      data: string
    then:
      - lambda: |-
          static const char* dk_days[8] = {"--", "Man", "Tir", "Ons", "Tor", "Fre", "Lør", "Søn"};
          static const char* cardinals[] = {"N","NNØ","NØ","ØNØ","Ø","ØSØ","SØ","SSØ","S","SSV","SV","VSV","V","VNV","NV","NNV"};
          lv_obj_t* day_lbl[5]    = { id(lbl_fd0_day),    id(lbl_fd1_day),    id(lbl_fd2_day),    id(lbl_fd3_day),    id(lbl_fd4_day) };
          lv_obj_t* icon_img[5]   = { id(img_fd0_cond),   id(img_fd1_cond),   id(img_fd2_cond),   id(img_fd3_cond),   id(img_fd4_cond) };
          lv_obj_t* temp_lbl[5]   = { id(lbl_fd0_temp),   id(lbl_fd1_temp),   id(lbl_fd2_temp),   id(lbl_fd3_temp),   id(lbl_fd4_temp) };
          lv_obj_t* wind_lbl[5]   = { id(lbl_fd0_wind),   id(lbl_fd1_wind),   id(lbl_fd2_wind),   id(lbl_fd3_wind),   id(lbl_fd4_wind) };
          lv_obj_t* precip_lbl[5] = { id(lbl_fd0_precip), id(lbl_fd1_precip), id(lbl_fd2_precip), id(lbl_fd3_precip), id(lbl_fd4_precip) };

          size_t pos = 0;
          int row = 0;
          while (row < 5 && pos <= data.size()) {
            size_t semi = data.find(';', pos);
            std::string token = (semi == std::string::npos) ? data.substr(pos) : data.substr(pos, semi - pos);
            if (token.empty()) break;

            std::string f[7];
            size_t fpos = 0;
            for (int i = 0; i < 7; i++) {
              size_t bar = token.find('|', fpos);
              f[i] = (bar == std::string::npos) ? token.substr(fpos) : token.substr(fpos, bar - fpos);
              fpos = (bar == std::string::npos) ? token.size() : bar + 1;
            }
            const std::string& cond = f[1];
            lv_obj_t* iw = icon_img[row];
            if      (cond == "clear-night")     lv_img_set_src(iw, id(img_sm_clear_night));
            else if (cond == "cloudy")          lv_img_set_src(iw, id(img_sm_cloudy));
            else if (cond == "fog")             lv_img_set_src(iw, id(img_sm_fog));
            else if (cond == "lightning")       lv_img_set_src(iw, id(img_sm_lightning));
            else if (cond == "lightning-rainy") lv_img_set_src(iw, id(img_sm_lightning_rainy));
            else if (cond == "partlycloudy")    lv_img_set_src(iw, id(img_sm_partlycloudy));
            else if (cond == "rainy")           lv_img_set_src(iw, id(img_sm_rainy));
            else if (cond == "snowy")           lv_img_set_src(iw, id(img_sm_snowy));
            else if (cond == "snowy-rainy")     lv_img_set_src(iw, id(img_sm_snowy_rainy));
            else if (cond == "windy")           lv_img_set_src(iw, id(img_sm_windy));
            else                                lv_img_set_src(iw, id(img_sm_clear_day));

            int bearing = atoi(f[5].c_str());
            std::string cardinal = cardinals[(int)((bearing + 11.25f) / 22.5f) % 16];

            int wd = atoi(f[0].c_str());
            lv_label_set_text(day_lbl[row], (wd >= 1 && wd <= 7) ? dk_days[wd] : "--");
            lv_label_set_text(temp_lbl[row], (f[2] + "°/" + f[3] + "°").c_str());
            lv_label_set_text(wind_lbl[row], (f[4] + " m/s " + cardinal).c_str());
            std::string precip = f[6];
            for (char& c : precip) if (c == '.') { c = ','; break; }
            lv_label_set_text(precip_lbl[row], (precip + " mm").c_str());

            row++;
            if (semi == std::string::npos) break;
            pos = semi + 1;
          }
          for (; row < 5; row++) {
            lv_img_set_src(icon_img[row], id(img_sm_clear_day));
            lv_label_set_text(day_lbl[row], "--");
            lv_label_set_text(temp_lbl[row], "--°/--°");
            lv_label_set_text(wind_lbl[row], "-- m/s --");
            lv_label_set_text(precip_lbl[row], "-- mm");
          }

# ---------------------------------------------------------------------------
# LVGL — page layout (display id resolved from host file)
# ---------------------------------------------------------------------------
lvgl:
  displays:
    - lvgl_display
  touchscreens:
    - touch_controller    
  color_depth: 16
  rotation: ${display_rotation}
  buffer_size: 100%
  full_refresh: true
  default_font: font_sm
  ### THEME ###
  theme:
    label:
      text_color: "${clr_text}"
      text_align: CENTER

  ### STYLES ###
  style_definitions:
    - id: grid_layout
      width: 100%
      height: 100%
      x: 0
      y: 0
      radius: 0      
      bg_color: ${clr_bg}
      pad_all: 0
      pad_left: 5
      pad_right: 5
      border_opa: TRANSP
    - id: grid_layout_nested
      width: 100%
      height: 100%
      x: 0
      y: 0
      radius: 0      
      bg_color: ${clr_card}
      pad_all: 0
      pad_left: 5
      pad_right: 5
      border_opa: TRANSP
    - id: widget_4x1
      width: 256 # Col: 64px
      height: 39 # Row: 39px
      x: 0
      y: 0
      radius: 5
      bg_color: ${clr_card}
      pad_all: 0
      border_opa: TRANSP
      grid_cell_x_align: CENTER
      grid_cell_y_align: CENTER
    - id: widget_4x2
      width: 256 # Col: 64px
      height: 78 # Row: 39px
      x: 0
      y: 0
      radius: 5
      bg_color: ${clr_card}
      pad_all: 0
      border_opa: TRANSP
      grid_cell_x_align: CENTER
      grid_cell_y_align: CENTER
    - id: widget_4x3
      width: 256 # Col: 64px
      height: 117 # Row: 39px
      x: 0
      y: 0
      radius: 5
      bg_color: ${clr_card}
      pad_all: 0
      border_opa: TRANSP
      grid_cell_x_align: CENTER
      grid_cell_y_align: CENTER
    - id: widget_4x4
      width: 256 # Col: 64px
      height: 156 # Row: 39px
      x: 0
      y: 0
      radius: 5
      bg_color: ${clr_card}
      pad_all: 0
      border_opa: TRANSP
      grid_cell_x_align: CENTER
      grid_cell_y_align: CENTER
    - id: widget_4x5
      width: 256 # Col: 64px
      height: 195 # Row: 39px
      x: 0
      y: 0
      radius: 5
      bg_color: ${clr_card}
      pad_all: 0
      border_opa: TRANSP
      grid_cell_x_align: CENTER
      grid_cell_y_align: CENTER
  
  pages:
  - id: main_page
    bg_color: ${clr_bg}
    pad_all: 0
    skip: false
    widgets:
      - obj:
          align: CENTER
          id: main_grid
          styles: grid_layout
          layout:
            type: grid
            grid_columns: [fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1)]
            grid_rows: [fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1)]
            grid_column_align: CENTER
            grid_row_align: CENTER
            pad_row: 5
            pad_column: 5
          widgets:
            - obj:
                styles: widget_4x1
                bg_color: ${clr_bg}
                grid_cell_column_pos: 0
                grid_cell_row_pos: 0
                grid_cell_column_span: 4
                grid_cell_row_span: 1
                grid_cell_x_align: START
                radius: 0
                widgets:
                  - label:
                      id: wifi_label
                      align: LEFT_MID
                      text_color: ${clr_wifi_bad}
                      text_font: mdi_sm
                      text: "\U000F092B"
            - obj:
                styles: widget_4x1
                bg_color: ${clr_bg}
                grid_cell_column_pos: 4
                grid_cell_row_pos: 0
                grid_cell_column_span: 4
                grid_cell_row_span: 1
                radius: 0
                widgets:
                  - label:
                      id: display_heder
                      align: CENTER
                      text_color: ${clr_text}
                      text_font: font_md
                      text: "${header_title}"
            - obj:
                styles: widget_4x1
                bg_color: ${clr_bg}
                grid_cell_column_pos: 8
                grid_cell_row_pos: 0
                grid_cell_column_span: 4
                grid_cell_row_span: 1
                radius: 0
                widgets:
                  - label:
                      id: time_label
                      align: RIGHT_MID
                      text_color: ${clr_text}
                      text: "00:00"
            - obj:
                styles: widget_4x5
                bg_color: ${clr_card}
                grid_cell_column_pos: 0
                grid_cell_row_pos: 1
                grid_cell_column_span: 4
                grid_cell_row_span: 5
                widgets:
                  - label:
                      align: TOP_RIGHT
                      x: -5
                      y: 5
                      text_font: mdi_sm
                      text: "\U000F0510"
                      text_color: ${clr_text}
                  - label:
                      align: TOP_MID
                      x: -25
                      y: 35
                      text: "\U000F005D"
                      text_font: mdi_sm
                      text_color: ${clr_temp_hot}
                  - label:
                      align: TOP_MID
                      x: 5
                      y: 35
                      id: lbl_temp_high
                      text: "--°"
                      text_color: ${clr_text}
                      text_font: font_md
                  - meter:
                      id: circle_temp
                      align: CENTER
                      width: 180
                      height: 180
                      bg_opa: TRANSP
                      border_width: 6
                      border_color: ${clr_temp_cold}
                      indicator:
                        bg_opa: TRANSP
                        border_width: 0                      
                      scales:
                        range_from: 0
                        range_to: 360
                        angle_range: 360
                        rotation: 270
                  - label:
                      id: lbl_temp_current
                      align: CENTER
                      text_color: ${clr_text}
                      text_font: font_xxl
                      text: "--,-°"
                  - label:
                      align: BOTTOM_MID
                      x: -25
                      y: -35
                      text: "\U000F0045"
                      text_font: mdi_sm
                      text_color: ${clr_temp_cold}
                  - label:
                      align: BOTTOM_MID
                      x: 5
                      y: -35
                      id: lbl_temp_low
                      text: "--°"
                      text_color: ${clr_text}
                      text_font: font_md
            # Wind Widget
            - obj:
                styles: widget_4x5
                bg_color: ${clr_card}
                grid_cell_column_pos: 4
                grid_cell_row_pos: 1
                grid_cell_column_span: 4
                grid_cell_row_span: 5
                widgets: 
                  # Header labels
                  - label:
                      align: TOP_RIGHT
                      x: -5
                      y: 5
                      text_font: mdi_sm
                      text: "\U000F059D"
                      text_color: ${clr_text}
                  - meter:
                      id: circle_wind_border
                      align: CENTER
                      width: 180
                      height: 180
                      bg_opa: TRANSP
                      border_width: 3
                      border_color: ${clr_wind_circle}
                      pad_all: 0
                      indicator:
                        bg_opa: TRANSP
                        border_width: 0                      
                      scales:
                        range_from: 0
                        range_to: 360
                        angle_range: 360
                        rotation: 270
                        indicators:
                          - image:
                              id: bearing_indicator
                              src: bearing_img
                              pivot_x: 0 
                              pivot_y: 12
                              value: 0
                          - image:
                              id: bearing_avg_indicator
                              src: bearing_avg_img
                              pivot_x: 0 
                              pivot_y: 9
                              value: 0
                        ticks:
                          count: 17
                          color: ${clr_tick}
                          length: 6
                          radial_offset: 0
                          major:
                            stride: 4
                            length: 10
                            width: 3
                            color: ${clr_text}
                            label_gap: 6
                            radial_offset: 0
                  - label:
                      align: TOP_MID
                      y: 35
                      id: lbl_wind_cardinal
                      text: "---"
                      text_color: ${clr_text}
                      text_font: font_md
                  - label:
                      id: lbl_wind_speed
                      align: CENTER
                      text_color: ${clr_text}
                      text_font: font_xxl
                      text: "__,_"
                  - label:
                      align: BOTTOM_MID
                      y: -48
                      id: lbl_wind_gust
                      text: "--,-"
                      text_color: ${clr_text_dim}
                      text_font: font_md
                  - label:
                      align: BOTTOM_MID
                      y: -30
                      text: "m/s"
                      text_color: ${clr_text}
                      text_font: font_sm
            # Rain Widget
            - obj:
                styles: widget_4x5
                bg_color: ${clr_card}
                grid_cell_column_pos: 8
                grid_cell_row_pos: 1
                grid_cell_column_span: 4
                grid_cell_row_span: 5
                widgets: 
                  # Header labels
                  - label:
                      align: TOP_RIGHT
                      x: -5
                      y: 5
                      text_font: mdi_sm
                      text: "\U000F0596"
                      text_color: ${clr_text}
                  - meter:
                      id: circle_rain
                      align: CENTER
                      width: 180
                      height: 180
                      bg_opa: TRANSP
                      border_width: 6
                      border_color: ${clr_temp_cold}
                      indicator:
                        bg_opa: TRANSP
                        border_width: 0                      
                      scales:
                        range_from: 0
                        range_to: 360
                        angle_range: 360
                        rotation: 270
                      widgets:
                        - label:
                            align: TOP_MID
                            y: 2
                            text_font: font_sm
                            text_color: "${clr_text_dim}"
                            text: "I går:"
                        - label:
                            id: lbl_rain_yesterday
                            align: TOP_MID
                            y: 20
                            text_font: font_md
                            text_color: "${clr_text}"
                            text: "--,-"
                        - label:
                            id: rain_today
                            align: CENTER
                            text_font: font_xxl
                            text: "--,-"
                        - label:
                            id: lbl_rain_rate
                            align: BOTTOM_MID
                            y: -30
                            recolor: true
                            text_font: font_sm
                            text_color: "${clr_text}"
                            text: "--,- #7788AA mm/t#"
                        - label:
                            align: BOTTOM_MID
                            y: -2
                            text_font: font_sm
                            text_color: "${clr_text}"
                            text_align: RIGHT
                            text: "mm"
            # Temperatur Additional Data — tap to toggle vs. lightning data
            - obj:
                styles: widget_4x2
                bg_color: ${clr_card}
                grid_cell_column_pos: 0
                grid_cell_row_pos: 6
                grid_cell_column_span: 4
                grid_cell_row_span: 2
                on_click:
                  - lambda: |-
                      if (lv_obj_has_flag(id(additional_lightning_grid), LV_OBJ_FLAG_HIDDEN)) {
                        lv_obj_add_flag(id(additional_temp_grid), LV_OBJ_FLAG_HIDDEN);
                        lv_obj_clear_flag(id(additional_lightning_grid), LV_OBJ_FLAG_HIDDEN);
                      } else {
                        lv_obj_clear_flag(id(additional_temp_grid), LV_OBJ_FLAG_HIDDEN);
                        lv_obj_add_flag(id(additional_lightning_grid), LV_OBJ_FLAG_HIDDEN);
                      }
                widgets:
                  - obj:
                      id: additional_temp_grid
                      clickable: false
                      styles: grid_layout_nested
                      align: CENTER
                      layout:
                        type: grid
                        grid_columns: [fr(1), fr(1), fr(1)]
                        grid_rows: [fr(1), 2, fr(2)]
                        grid_column_align: CENTER
                        grid_row_align: CENTER
                      widgets:
                        - label:
                            grid_cell_x_align: CENTER
                            grid_cell_column_pos: 0
                            grid_cell_row_pos: 0
                            text_align: CENTER
                            text_font: font_sm
                            text_color: "${clr_text_dim}"
                            text: "Føles som"
                        - obj:
                            clickable: false
                            grid_cell_column_pos: 0
                            grid_cell_row_pos: 1
                            grid_cell_column_span: 3
                            grid_cell_x_align: STRETCH
                            height: 2
                            bg_color: "${clr_separator}"
                            pad_all: 0
                            border_width: 0
                        - label:
                            id: temp_feels_like
                            grid_cell_x_align: CENTER
                            grid_cell_y_align: START
                            grid_cell_column_pos: 0
                            grid_cell_row_pos: 2
                            text_align: CENTER
                            text_font: font_lg
                            text_color: "${clr_text}"
                            text: "--,-°"
                        - label:
                            grid_cell_x_align: CENTER
                            grid_cell_column_pos: 1
                            grid_cell_row_pos: 0
                            text_align: CENTER
                            text_font: font_sm
                            text_color: "${clr_text_dim}"
                            text: "Dugpunkt"
                        - label:
                            id: temp_dewpoint
                            grid_cell_x_align: CENTER
                            grid_cell_y_align: START
                            grid_cell_column_pos: 1
                            grid_cell_row_pos: 2
                            text_align: CENTER
                            text_font: font_lg
                            text_color: "${clr_text}"
                            text: "--,-°"
                        - label:
                            grid_cell_x_align: CENTER
                            grid_cell_column_pos: 2
                            grid_cell_row_pos: 0
                            text_align: CENTER
                            text_font: font_sm
                            text_color: "${clr_text_dim}"
                            text: "Fugtighed"
                        - label:
                            id: lbl_humidity
                            grid_cell_x_align: CENTER
                            grid_cell_y_align: START
                            grid_cell_column_pos: 2
                            grid_cell_row_pos: 2
                            text_align: CENTER
                            text_font: font_lg
                            text_color: "${clr_text}"
                            text: "--%"
                  - obj:
                      id: additional_lightning_grid
                      hidden: true
                      clickable: false
                      scrollable: false
                      styles: grid_layout_nested
                      align: CENTER
                      layout:
                        type: grid
                        grid_columns: [fr(1), fr(1), fr(1)]
                        grid_rows: [fr(1), 2, fr(2)]
                        grid_column_align: CENTER
                        grid_row_align: CENTER
                      widgets:
                        - label:
                            grid_cell_x_align: CENTER
                            grid_cell_column_pos: 0
                            grid_cell_row_pos: 0
                            text_align: CENTER
                            text_font: font_sm
                            text_color: "${clr_text_dim}"
                            text: "Sidste lyn"
                        - obj:
                            clickable: false
                            grid_cell_column_pos: 0
                            grid_cell_row_pos: 1
                            grid_cell_column_span: 3
                            grid_cell_x_align: STRETCH
                            height: 2
                            bg_color: "${clr_separator}"
                            pad_all: 0
                            border_width: 0
                        - label:
                            id: lbl_lightning_latest
                            grid_cell_x_align: CENTER
                            grid_cell_y_align: START
                            grid_cell_column_pos: 0
                            grid_cell_row_pos: 2
                            text_align: CENTER
                            text_font: font_md
                            text_color: "${clr_text}"
                            text: "--"
                        - label:
                            grid_cell_x_align: CENTER
                            grid_cell_column_pos: 1
                            grid_cell_row_pos: 0
                            text_align: CENTER
                            text_font: font_sm
                            text_color: "${clr_text_dim}"
                            text: "Antal (3t)"
                        - label:
                            id: lbl_lightning_count
                            grid_cell_x_align: CENTER
                            grid_cell_y_align: START
                            grid_cell_column_pos: 1
                            grid_cell_row_pos: 2
                            text_align: CENTER
                            text_font: font_md
                            text_color: "${clr_text}"
                            text: "--"
                        - label:
                            grid_cell_x_align: CENTER
                            grid_cell_column_pos: 2
                            grid_cell_row_pos: 0
                            text_align: CENTER
                            text_font: font_sm
                            text_color: "${clr_text_dim}"
                            text: "Afstand"
                        - label:
                            id: lbl_lightning_distance
                            grid_cell_x_align: CENTER
                            grid_cell_y_align: START
                            grid_cell_column_pos: 2
                            grid_cell_row_pos: 2
                            text_align: CENTER
                            text_font: font_md
                            text_color: "${clr_text}"
                            text: "--"
            # Wind Additional Data
            - obj:
                styles: widget_4x2
                bg_color: ${clr_card}
                grid_cell_column_pos: 4
                grid_cell_row_pos: 6
                grid_cell_column_span: 4
                grid_cell_row_span: 2
                widgets:
                  - obj:
                      styles: grid_layout_nested
                      align: CENTER
                      layout:
                        type: grid
                        grid_columns: [fr(1), fr(1)]
                        grid_rows: [fr(1), 2, fr(2)]
                        grid_column_align: CENTER
                        grid_row_align: CENTER
                      widgets:
                        - label:
                            grid_cell_x_align: CENTER
                            grid_cell_column_pos: 0
                            grid_cell_row_pos: 0
                            text_align: CENTER
                            text_font: font_sm
                            text_color: "${clr_text_dim}"
                            text: "Vind gns. 10m"
                        - obj:
                            grid_cell_column_pos: 0
                            grid_cell_row_pos: 1
                            grid_cell_column_span: 2
                            grid_cell_x_align: STRETCH
                            height: 2
                            bg_color: "${clr_separator}"
                            pad_all: 0
                            border_width: 0
                        - label:
                            id: wind_10min_avg
                            grid_cell_x_align: CENTER
                            grid_cell_y_align: START
                            grid_cell_column_pos: 0
                            grid_cell_row_pos: 2
                            text_align: CENTER
                            text_font: font_lg
                            text_color: "${clr_text}"
                            text: "--,-"
                        - label:
                            grid_cell_x_align: CENTER
                            grid_cell_column_pos: 1
                            grid_cell_row_pos: 0
                            text_align: CENTER
                            text_font: font_sm
                            text_color: "${clr_text_dim}"
                            text: "Maks. vindstød"
                        - label:
                            id: wind_max_gust
                            grid_cell_x_align: CENTER
                            grid_cell_y_align: START
                            grid_cell_column_pos: 1
                            grid_cell_row_pos: 2
                            text_align: CENTER
                            text_font: font_lg
                            text_color: "${clr_text}"
                            text: "--,-"
            # Sunrise - Sunset
            - obj:
                styles: widget_4x2
                bg_color: ${clr_card}
                grid_cell_column_pos: 8
                grid_cell_row_pos: 6
                grid_cell_column_span: 4
                grid_cell_row_span: 2
                widgets:
                  - label:
                      align: TOP_LEFT
                      x: 5
                      text_font: font_sm
                      text_color: "${clr_text_dim}"
                      text: "Solopgang"
                  - label:
                      align: TOP_RIGHT
                      x: -5
                      text_font: font_sm
                      text_color: "${clr_text_dim}"
                      text: "Solnedgang"
                  - obj:
                      align: TOP_MID
                      y: 20
                      height: 2
                      width: 246
                      bg_color: "${clr_separator}"
                      pad_all: 0
                      border_width: 0
                  - label:
                      align: BOTTOM_LEFT
                      x: 5
                      y: -15
                      text_font: mdi_md
                      text_color: "${clr_temp_cool}"
                      text: "${sym_sunrise}"
                  - label:
                      id: lbl_sunrise
                      align: BOTTOM_LEFT
                      x: 35
                      y: -15
                      text_font: font_md
                      text_color: "${clr_text}"
                      text: "--:--"
                  - label:
                      align: BOTTOM_RIGHT
                      x: -5
                      y: -15
                      text_font: mdi_md
                      text_color: "${clr_temp_warm}"
                      text: "${sym_sunset}"
                  - label:
                      id: lbl_sunset
                      align: BOTTOM_RIGHT
                      x: -35
                      y: -15
                      text_font: font_md
                      text_color: "${clr_text}"
                      text: "--:--"

            # UV and Solar Radiation widgets
            - obj:
                styles: widget_4x4
                bg_color: ${clr_card}
                grid_cell_column_pos: 0
                grid_cell_row_pos: 8
                grid_cell_column_span: 4
                grid_cell_row_span: 4
                pad_left: 5
                pad_right: 5
                widgets:
                  # Header labels
                  - label:
                      align: TOP_LEFT
                      y: 5
                      text_font: mdi_sm
                      text: "\U000F17FE"
                      text_color: ${clr_text}
                  - label:
                      align: TOP_RIGHT
                      y: 5
                      text_font: mdi_sm
                      text: "\U000F1A73"
                      text_color: ${clr_text}
                  # UV Index
                  - meter:
                      id: circle_uv
                      align: LEFT_MID
                      width: 115
                      height: 115
                      bg_opa: TRANSP
                      border_width: 6
                      border_color: ${clr_temp_cold}
                      indicator:
                        bg_opa: TRANSP
                        border_width: 0                      
                      scales:
                        range_from: 0
                        range_to: 360
                        angle_range: 360
                        rotation: 270
                      widgets:
                        - label:
                            align: TOP_MID
                            y: 5
                            text_color: ${clr_text}
                            text_font: font_xs
                            text: "UV"
                        - label:
                            id: lbl_uv
                            align: CENTER
                            text_color: ${clr_text}
                            text_font: font_xl
                            text: "--.-"
                        - label:
                            id: lbl_uv_unit
                            align: BOTTOM_MID
                            y: -5
                            text_color: ${clr_text_dim}
                            text_font: font_xs
                            text: "UV Index"
                  # Solar Radiation
                  - meter:
                      id: circle_solar
                      align: RIGHT_MID
                      width: 115
                      height: 115
                      bg_opa: TRANSP
                      border_width: 6
                      border_color: ${clr_temp_cool}
                      indicator:
                        bg_opa: TRANSP
                        border_width: 0                      
                      scales:
                        range_from: 0
                        range_to: 360
                        angle_range: 360
                        rotation: 270
                      widgets:
                        - label:
                            align: TOP_MID
                            y: 5
                            text_color: ${clr_text}
                            text_font: font_xs
                            text: "Indstråling"
                        - label:
                            id: lbl_solar
                            align: CENTER
                            text_color: ${clr_text}
                            text_font: font_xl
                            text: "--.-"
                        - label:
                            id: lbl_solar_unit
                            align: BOTTOM_MID
                            y: -5
                            text_color: ${clr_text_dim}
                            text_font: font_xs
                            text: "W/m²"

            # Forecast Widget — tap to open the 5h/5d forecast popup
            - obj:
                styles: widget_4x4
                bg_color: ${clr_card}
                grid_cell_column_pos: 4
                grid_cell_row_pos: 8
                grid_cell_column_span: 4
                grid_cell_row_span: 4
                on_click:
                  - script.execute: forecast_popup_open
                widgets:
                  # Header icon
                  - label:
                      align: TOP_MID
                      x: 5
                      y: 5
                      text_font: font_sm
                      text: "Vejret i dag"
                      text_color: ${clr_tick}
                  # Weather condition images — one per condition, hidden/shown by lambda
                  - image:
                      id: fimg_clear_day
                      align: LEFT_MID
                      x: 8
                      y: -18
                      src: img_clear_day
                  - image:
                      id: fimg_clear_night
                      align: LEFT_MID
                      x: 8
                      y: -18
                      src: img_clear_night
                      hidden: true
                  - image:
                      id: fimg_cloudy
                      align: LEFT_MID
                      x: 8
                      y: -18
                      src: img_cloudy
                      hidden: true
                  - image:
                      id: fimg_fog
                      align: LEFT_MID
