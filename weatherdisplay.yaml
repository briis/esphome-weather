# ============================================================
# Weather Display — ESP32-S3 hardware target
# Waveshare ESP32-S3-Touch-LCD-7  800×480
# ESP32-S3, 16 MB flash, 8 MB octal PSRAM
#
# Flash:
#   esphome run weatherdisplay.yaml
# ============================================================
substitutions:
  name: "Weather Display"
  device: "weatherdisplay"
  version: "0.1.0"
  created_by: "Bjarne Riis"
  # Temperature — overrides defaults in weatherdisplay-common.yaml
  ha_temp_current: "sensor.holmeengen_sensor_temperature"
  ha_temp_high:    "max_temperature_today"
  ha_temp_low:     "min_temperature_today"

  # Wind — overrides defaults in weatherdisplay-common.yaml
  ha_wind_speed:       "sensor.holmeengen_sensor_wind_speed"
  ha_wind_bearing:     "sensor.holmeengen_sensor_wind_bearing"
  ha_wind_gust:        "sensor.holmeengen_sensor_wind_gust"
  ha_wind_bearing_avg: "sensor.holmeengen_sensor_wind_bearing_avg_10_min"

esphome:
  name: "${device}"
  friendly_name: "${name}"
  project:
    name: "briis.${device}"
    version: "${version}"
  on_boot:
    priority: -200.0
    then:
      - lambda: |-
          lv_obj_set_style_arc_opa(id(arc_wind_current), LV_OPA_TRANSP, LV_PART_MAIN);
          lv_obj_set_style_arc_opa(id(arc_wind_avg), LV_OPA_TRANSP, LV_PART_MAIN);
          lv_obj_set_style_opa(id(arc_wind_current), LV_OPA_TRANSP, LV_PART_KNOB);
          lv_obj_set_style_opa(id(arc_wind_avg), LV_OPA_TRANSP, LV_PART_KNOB);
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio

# ---------------------------------------------------------------------------
# ESP32-S3 — esp-idf required for mipi_rgb display support
# ---------------------------------------------------------------------------
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_LINE_SIZE: "64"

psram:
  mode: octal
  speed: 80MHz

# ---------------------------------------------------------------------------
# Connectivity
# ---------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "WeatherDisplay Fallback"
  on_connect:
    then:
      - lambda: |-
          lv_label_set_text(id(lbl_wifi), "\U000F0928");
          lv_obj_set_style_text_color(id(lbl_wifi), lv_color_hex(${clr_wifi_good}), 0);
  on_disconnect:
    then:
      - lambda: |-
          lv_label_set_text(id(lbl_wifi), "\U000F092B");
          lv_obj_set_style_text_color(id(lbl_wifi), lv_color_hex(${clr_wifi_bad}), 0);

api:
  encryption:
    key: !secret ha_api_key

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      then:
        switch.turn_off: backlight

captive_portal:

logger:
  level: ERROR

# ---------------------------------------------------------------------------
# Time — syncs system clock from HA; on_time_sync gives immediate display
# The interval in weatherdisplay-common.yaml then keeps lbl_time updated
# ---------------------------------------------------------------------------
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - lvgl.label.update:
            id: lbl_time
            text: !lambda |-
              auto now = id(ha_time).now();
              if (!now.is_valid()) return std::string("--:--");
              char buf[6];
              sprintf(buf, "%02d:%02d", now.hour, now.minute);
              return std::string(buf);

# ---------------------------------------------------------------------------
# Hardware — I/O expander, display, touch, backlight
# ---------------------------------------------------------------------------
i2c:
  - id: i2c_touch_bus
    sda: GPIO8
    scl: GPIO9
    scan: true
    frequency: 400kHz

ch422g:
  id: io_ex

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: lvgl_display
    auto_clear_enabled: false
    update_interval: never
    color_order: RGB
    pclk_frequency: 16MHz
    dimensions:
      width: 800
      height: 480
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin:
      number: 7
    reset_pin:
      ch422g: io_ex
      number: 3
    enable_pin:
      ch422g: io_ex
      number: 2
      allow_other_uses: true
    pclk_inverted: true
    hsync_back_porch: 30
    hsync_front_porch: 210
    hsync_pulse_width: 30
    vsync_back_porch: 4
    vsync_front_porch: 4
    vsync_pulse_width: 4
    data_pins:
      red:
        - 1        # r3
        - 2        # r4
        - 42       # r5
        - 41       # r6
        - 40       # r7
      blue:
        - 14       # b3
        - 38       # b4
        - 18       # b5
        - 17       # b6
        - 10       # b7
      green:
        - 39       # g2
        - 0        # g3
        - 45       # g4
        - 48       # g5
        - 47       # g6
        - 21       # g7

touchscreen:
  platform: gt911
  id: touch_controller
  display: lvgl_display
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: io_ex
    number: 1
    mode: output
  on_touch:
    then:
      - if:
          condition:
            - lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - if:
          condition:
            switch.is_off: backlight
          then:
            - switch.turn_on: backlight

switch:
  - platform: gpio
    id: backlight
    name: "Baggrundslys"
    pin:
      ch422g: io_ex
      number: 2
      allow_other_uses: true
      mode:
        output: true
      inverted: false
    restore_mode: ALWAYS_ON

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi Signal"
    update_interval: 60s
    on_value:
      then:
        - lambda: |-
            const char* icon;
            lv_color_t color;
            if (x >= -55) {
              icon = "\U000F0928"; color = lv_color_hex(${clr_wifi_good});  // strong — green
            } else if (x >= -67) {
              icon = "\U000F0925"; color = lv_color_hex(${clr_wifi_good});  // good — green
            } else if (x >= -80) {
              icon = "\U000F0922"; color = lv_color_hex(${clr_wifi_weak});  // weak — amber
            } else {
              icon = "\U000F091F"; color = lv_color_hex(${clr_wifi_bad});  // low — red
            }
            lv_label_set_text(id(lbl_wifi), icon);
            lv_obj_set_style_text_color(id(lbl_wifi), color, 0);

  # ---------------------------------------------------------------------------
  # Temperature — current, daily high and low
  # ---------------------------------------------------------------------------
  - platform: homeassistant
    id: sensor_temp_current
    entity_id: ${ha_temp_current}
    on_value:
      then:
        - lambda: |-
            auto fmt = [](char* buf, int n, float v) {
              snprintf(buf, n, "%.1f°", v);
              for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
            };
            char buf[12];
            fmt(buf, sizeof(buf), x);
            lv_label_set_text(id(lbl_temp_current), buf);
            lv_color_t c;
            if (x < 5.0f)       c = lv_color_hex(${clr_temp_cold});
            else if (x < 15.0f) c = lv_color_hex(${clr_temp_cool});
            else if (x < 20.0f) c = lv_color_hex(${clr_temp_warm});
            else                 c = lv_color_hex(${clr_temp_hot});
            lv_obj_set_style_border_color(id(circle_temp), c, 0);

  - platform: homeassistant
    id: sensor_temp_high
    entity_id: ${ha_temp_current}
    attribute: ${ha_temp_high}
    on_value:
      then:
        - lambda: |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%.1f°", x);
            for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
            lv_label_set_text(id(lbl_temp_high), buf);

  - platform: homeassistant
    id: sensor_temp_low
    entity_id: ${ha_temp_current}
    attribute: ${ha_temp_low}
    on_value:
      then:
        - lambda: |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%.1f°", x);
            for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
            lv_label_set_text(id(lbl_temp_low), buf);

  # ---------------------------------------------------------------------------
  # Wind — current bearing, speed (average), gust, average bearing
  # ---------------------------------------------------------------------------
  - platform: homeassistant
    id: sensor_wind_bearing
    entity_id: ${ha_wind_bearing}
    on_value:
      then:
        - lvgl.arc.update:
            id: arc_wind_current
            start_angle: !lambda return ((int)x + 262) % 360;
            end_angle: !lambda return ((int)x + 278) % 360;
            value: 100
        - lambda: |-
            auto cardinal = [](float b) -> const char* {
              static const char* d[] = {"N","NØ","Ø","SØ","S","SV","V","NV"};
              return d[((int)(b + 22.5f) / 45) % 8];
            };
            char buf[12];
            snprintf(buf, sizeof(buf), "%s %d°", cardinal(x), (int)x);
            lv_label_set_text(id(lbl_wind_info), buf);

  - platform: homeassistant
    id: sensor_wind_speed
    entity_id: ${ha_wind_speed}
    on_value:
      then:
        - lambda: |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%.1f", x);
            for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
            lv_label_set_text(id(lbl_wind_speed), buf);

  - platform: homeassistant
    id: sensor_wind_gust
    entity_id: ${ha_wind_gust}
    on_value:
      then:
        - lambda: |-
            char buf[16];
            snprintf(buf, sizeof(buf), "Stød %.1f", x);
            for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
            lv_label_set_text(id(lbl_wind_gust), buf);

  - platform: homeassistant
    id: sensor_wind_bearing_avg
    entity_id: ${ha_wind_bearing_avg}
    on_value:
      then:
        - lvgl.arc.update:
            id: arc_wind_avg
            start_angle: !lambda return ((int)x + 262) % 360;
            end_angle: !lambda return ((int)x + 278) % 360;
            value: 100

packages:
  remote_package_files:
    url: https://git.digitalhomes.dk/briis/esphome-weather
    files: 
      - weatherdisplay-common.yaml
    ref: main
    username: briis
    password: !secret forgejo_token
    refresh: 10s
