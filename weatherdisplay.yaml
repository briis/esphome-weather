# ============================================================
# Weather Display — ESP32-S3 hardware target
# Waveshare ESP32-S3-Touch-LCD-7  800×480
# ESP32-S3, 16 MB flash, 8 MB octal PSRAM
#
# Flash:
#   esphome run esphome-weather.yaml
# ============================================================
substitutions:
  name: "Weather Display"
  device: "weatherdisplay"
  version: 1.0.7
  created_by: "Bjarne Riis"
  display_rotation: "180"

  # Temperature — overrides defaults in weather-common.yaml
  ha_temp_current: "sensor.wdl_home_air_temperature_c"
  ha_temp_high:    "sensor.wdl_home_air_temp_high_today"
  ha_temp_low:     "sensor.wdl_home_air_temp_low_today"
  ha_feels_like:   "sensor.wdl_home_feels_like_c"
  ha_dew_point:    "sensor.wdl_home_dew_point_c"
  ha_humidity:     "sensor.wdl_home_relative_humidity_pct"

  # Wind — overrides defaults in weather-common.yaml
  ha_wind_speed:       "sensor.wdl_home_wind_avg_ms"
  ha_wind_bearing:     "sensor.wdl_home_wind_direction_deg"
  ha_wind_gust:        "sensor.wdl_home_wind_gust_ms"
  ha_wind_gust_high:   "sensor.wdl_home_wind_gust_high_today"
  ha_wind_bearing_avg: "sensor.wdl_home_wind_bearing_avg_day"
  ha_wind_speed_avg:   "sensor.wdl_home_wind_speed_avg_10min"

  # UV & Solar Radiation — overrides defaults in weather-common.yaml
  ha_uv_index:         "sensor.wdl_home_uv_index"
  ha_solar_radiation:  "sensor.wdl_home_solar_radiation_wm2"

  # Barometer - overrides defaults in weather-common.yaml
  ha_pressure:         "sensor.wdl_home_sea_level_pressure_mb"
  ha_pressure_trend:   "sensor.wdl_home_pressure_trend"
  ha_pressure_trend_value: "sensor.wdl_home_sea_level_pressure_trend_mb"

  # Rain — overrides defaults in weather-common.yaml
  ha_rain_today:       "sensor.wdl_home_rain_accumulation_mm"
  ha_rain_rate:        "sensor.wdl_home_rain_rate_mmh"
  ha_rain_yesterday:   "sensor.wdl_home_rain_total_yesterday"

  # Forecast — overrides defaults in weather-common.yaml
  ha_fcast_condition:     "weather.wdl_home_weather"
  ha_fcast_condition_txt: "sensor.wdl_home_weather_condition"
  ha_fcast_description:   "sensor.wdl_home_forecast_description"
  ha_fcst_temp_high:      "sensor.wdl_home_forecast_temperature_high_today"
  ha_fcst_temp_low:       "sensor.wdl_home_forecast_temperature_low_today"
  ha_fcst_precip_prob:    "sensor.wdl_home_forecast_precipitation_probability_today"
  ha_fcst_precipitation:  "sensor.wdl_home_forecast_precipitation_today"
  
  # AQI — overrides defaults in weather-common.yaml
  ha_aqi_index:       "sensor.wdl_home_aqi_pm2p5"
#  ha_aqi_pm10:        "sensor.holmeengen_sensor_particulate_matter_pm10"
#  ha_aqi_pm25:        "sensor.holmeengen_sensor_particulate_matter_pm25"
  
  # Lightning — overrides defaults in weather-common.yaml
  ha_lightning_latest:    "sensor.wdl_home_lightning_last_detected"
  ha_lightning_strikes3h: "sensor.wdl_home_lightning_count_3h"
  ha_lightning_distance:  "sensor.wdl_home_lightning_min_dist_3h_km"
  
  # Sunrise - Sunset — overrides defaults in weather-common.yaml
  ha_sunrise:    "sensor.next_sunrise"
  ha_sunset:     "sensor.next_sunset"
  sym_sunrise:   "\U000F059C"
  sym_sunset:    "\U000F059B"

esphome:
  name: "${device}"
  friendly_name: "${name}"
  project:
    name: "briis.${device}"
    version: "${version}"
  on_boot:
    priority: -200.0
    then:
      - lambda: |-
          lv_obj_set_style_x(id(bearing_indicator), 78, LV_PART_MAIN);
          lv_obj_set_style_transform_pivot_x(id(bearing_indicator), -66, LV_PART_MAIN);
          lv_obj_set_style_transform_pivot_y(id(bearing_indicator), 12, LV_PART_MAIN);
          lv_obj_set_style_x(id(bearing_avg_indicator), 78, LV_PART_MAIN);
          lv_obj_set_style_transform_pivot_x(id(bearing_avg_indicator), -69, LV_PART_MAIN);
          lv_obj_set_style_transform_pivot_y(id(bearing_avg_indicator), 9, LV_PART_MAIN);
  build_flags:
    - "-DBOARD_HAS_PSRAM"

# ---------------------------------------------------------------------------
# ESP32-S3 — esp-idf required for mipi_rgb display support
# ---------------------------------------------------------------------------
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_LINE_SIZE: "64"
      CONFIG_LCD_RGB_ISR_IRAM_SAFE: "y"
      CONFIG_ESPTOOLPY_FLASH_MODE_AUTO_DETECT: ""
      CONFIG_ESPTOOLPY_FLASHMODE_DIO: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

psram:
  mode: octal
  speed: 80MHz

# ---------------------------------------------------------------------------
# Connectivity
# ---------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "WeatherDisplay Fallback"
  on_connect:
    then:
      - lambda: |-
          lv_label_set_text(id(wifi_label), "\U000F0928");
          lv_obj_set_style_text_color(id(wifi_label), lv_color_hex(${clr_wifi_good}), 0);
  on_disconnect:
    then:
      - lambda: |-
          lv_label_set_text(id(wifi_label), "\U000F092B");
          lv_obj_set_style_text_color(id(wifi_label), lv_color_hex(${clr_wifi_bad}), 0);

api:
  encryption:
    key: !secret ha_api_key

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      then:
        switch.turn_off: backlight

captive_portal:

logger:
  level: ERROR

# ---------------------------------------------------------------------------
# Time — syncs from HA; on_time_sync gives immediate display update.
# id: system_time matches the id used by the lvgl_update_clock script in
# weather-common.yaml, so both SDL and hardware share one script.
# on_time keeps the clock ticking every minute thereafter.
# ---------------------------------------------------------------------------
time:
  - platform: homeassistant
    id: system_time
    on_time_sync:
      then:
        - script.execute: lvgl_update_clock
        - script.execute: night_mode_check
    on_time:
      - seconds: 0
        minutes: '*'
        then:
          - script.execute: lvgl_update_clock
          - script.execute: night_mode_check
          - script.execute: lightning_relative_time_update

# ---------------------------------------------------------------------------
# Hardware — I/O expander, display, touch, backlight
# ---------------------------------------------------------------------------
i2c:
  - id: i2c_touch_bus
    sda: GPIO8
    scl: GPIO9
    scan: true
    frequency: 400kHz

ch422g:
  id: io_ex

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: lvgl_display
    auto_clear_enabled: false
    update_interval: never
    color_order: RGB
    pclk_frequency: 16MHz
    dimensions:
      width: 800
      height: 480
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin:
      number: 7
    reset_pin:
      ch422g: io_ex
      number: 3
    enable_pin:
      ch422g: io_ex
      number: 2
      allow_other_uses: true
    pclk_inverted: true
    hsync_back_porch: 30
    hsync_front_porch: 210
    hsync_pulse_width: 30
    vsync_back_porch: 4
    vsync_front_porch: 4
    vsync_pulse_width: 4
    data_pins:
      red:
        - 1        # r3
        - 2        # r4
        - 42       # r5
        - 41       # r6
        - 40       # r7
      blue:
        - 14       # b3
        - 38       # b4
        - 18       # b5
        - 17       # b6
        - 10       # b7
      green:
        - 39       # g2
        - 0        # g3
        - 45       # g4
        - 48       # g5
        - 47       # g6
        - 21       # g7

touchscreen:
  platform: gt911
  id: touch_controller
  display: lvgl_display
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: io_ex
    number: 1
    mode: output
  on_touch:
    then:
      - if:
          condition:
            - lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - if:
          condition:
            switch.is_on: night_mode_switch
          then:
            - script.execute: night_mode_sleep_timer
          else:
            - if:
                condition:
                  switch.is_off: backlight
                then:
                  - switch.turn_on: backlight

switch:
  - platform: gpio
    id: backlight
    name: "Baggrundslys"
    pin:
      ch422g: io_ex
      number: 2
      allow_other_uses: true
      mode:
        output: true
      inverted: false
    restore_mode: ALWAYS_ON
    on_turn_on:
      - delay: 500ms
      - lvgl.resume
      - lvgl.widget.redraw
    on_turn_off:
      - lvgl.pause

  - platform: template
    id: night_mode_switch
    name: "Nat mode"
    icon: "mdi:weather-night"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - script.execute: night_mode_check
    turn_off_action:
      - switch.turn_on: backlight

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi Signal"
    update_interval: 60s
    on_value:
      then:
        - lambda: |-
            const char* icon;
            lv_color_t color;
            if (x >= -55) {
              icon = "\U000F0928"; color = lv_color_hex(${clr_wifi_good});
            } else if (x >= -67) {
              icon = "\U000F0925"; color = lv_color_hex(${clr_wifi_good});
            } else if (x >= -80) {
              icon = "\U000F0922"; color = lv_color_hex(${clr_wifi_weak});
            } else {
              icon = "\U000F091F"; color = lv_color_hex(${clr_wifi_bad});
            }
            lv_label_set_text(id(wifi_label), icon);
            lv_obj_set_style_text_color(id(wifi_label), color, 0);

  # ---------------------------------------------------------------------------
  # Temperature — current, daily high and low
  # ---------------------------------------------------------------------------
  - platform: homeassistant
    id: sensor_temp_current
    entity_id: ${ha_temp_current}
    on_value:
      then:
        - lambda: |-
            auto fmt = [](char* buf, int n, float v) {
              snprintf(buf, n, "%.1f°", v);
              for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
            };
            char buf[12];
            fmt(buf, sizeof(buf), x);
            lv_label_set_text(id(lbl_temp_current), buf);
            lv_color_t c;
            if (x < 5.0f)       c = lv_color_hex(${clr_temp_cold});
            else if (x < 15.0f) c = lv_color_hex(${clr_temp_cool});
            else if (x < 20.0f) c = lv_color_hex(${clr_temp_warm});
            else                 c = lv_color_hex(${clr_temp_hot});
            lv_obj_set_style_border_color(id(circle_temp), c, 0);

  - platform: homeassistant
    id: sensor_temp_high
    entity_id: ${ha_temp_high}
    on_value:
      then:
        - lambda: |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%.1f°", x);
            for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
            lv_label_set_text(id(lbl_temp_high), buf);

  - platform: homeassistant
    id: sensor_temp_low
    entity_id: ${ha_temp_low}
    on_value:
      then:
        - lambda: |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%.1f°", x);
            for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
            lv_label_set_text(id(lbl_temp_low), buf);

  - platform: homeassistant
    id: sensor_feels_like
    entity_id: ${ha_feels_like}
    on_value:
      then:
        - lambda: |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%.1f°", x);
            for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
            lv_label_set_text(id(temp_feels_like), buf);

  - platform: homeassistant
    id: sensor_dew_point
    entity_id: ${ha_dew_point}
    on_value:
      then:
        - lambda: |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%.1f°", x);
            for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
            lv_label_set_text(id(temp_dewpoint), buf);

  - platform: homeassistant
    id: sensor_humidity
    entity_id: ${ha_humidity}
    on_value:
      then:
        - lambda: |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f%%", x);
            lv_label_set_text(id(lbl_humidity), buf);

  # ---------------------------------------------------------------------------
  # Wind — bearing, speed, gust, average bearing
  # ---------------------------------------------------------------------------
  - platform: homeassistant
    id: sensor_wind_bearing
    entity_id: ${ha_wind_bearing}
    on_value:
      then:
        - lambda: |-
            auto cardinal = [](float b) -> const char* {
              static const char* d[] = {"N","NNØ","NØ","ØNØ","Ø","ØSØ","SØ","SSØ","S","SSV","SV","VSV","V","VNV","NV","NNV"};
              return d[(int)((b + 11.25f) / 22.5f) % 16];
            };
            char buf[8];
            snprintf(buf, sizeof(buf), "%s", cardinal(x));
            lv_label_set_text(id(lbl_wind_cardinal), buf);
            lv_obj_set_style_transform_rotation(id(bearing_indicator), lv_get_needle_angle_for_value(id(bearing_indicator), (int)x) * 10, LV_PART_MAIN);

  - platform: homeassistant
    id: sensor_wind_speed
    entity_id: ${ha_wind_speed}
    on_value:
      then:
        - lambda: |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%.1f", x);
            for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
            lv_label_set_text(id(lbl_wind_speed), buf);

  - platform: homeassistant
    id: sensor_wind_gust
    entity_id: ${ha_wind_gust}
    on_value:
      then:
        - lambda: |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%.1f", x);
            for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
            lv_label_set_text(id(lbl_wind_gust), buf);

  - platform: homeassistant
    id: sensor_wind_bearing_avg
    entity_id: ${ha_wind_bearing_avg}
    on_value:
      then:
        - lambda: |-
            lv_obj_set_style_transform_rotation(id(bearing_avg_indicator), lv_get_needle_angle_for_value(id(bearing_avg_indicator), (int)x) * 10, LV_PART_MAIN);

  - platform: homeassistant
    id: sensor_wind_speed_avg
    entity_id: ${ha_wind_speed_avg}
    on_value:
      then:
        - lambda: |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%.1f", x);
            for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
            lv_label_set_text(id(wind_10min_avg), buf);

  - platform: homeassistant
    id: sensor_wind_gust_high
    entity_id: ${ha_wind_gust_high}
    on_value:
      then:
        - lambda: |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%.1f", x);
            for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
            lv_label_set_text(id(wind_max_gust), buf);

  # ---------------------------------------------------------------------------
  # UV & Solar Radiation
  # ---------------------------------------------------------------------------
  - platform: homeassistant
    id: sensor_uv_index
    entity_id: ${ha_uv_index}
    on_value:
      then:
        - lambda: |-
            auto uv_color = [](int uv) -> lv_color_t {
              if (uv <= 2)  return lv_color_hex(${clr_wifi_good});   // 0–2  low       green
              if (uv <= 5)  return lv_color_hex(${clr_temp_cool});   // 3–5  moderate  yellow
              if (uv <= 7)  return lv_color_hex(${clr_temp_warm});   // 6–7  high      orange
              if (uv <= 10) return lv_color_hex(${clr_temp_hot});    // 8–10 very high red
              return lv_color_hex(0x9C27B0);                         // 11+  extreme   violet
            };
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f", x);
            lv_label_set_text(id(lbl_uv), buf);
            lv_obj_set_style_border_color(id(circle_uv), uv_color((int)x), 0);

  - platform: homeassistant
    id: sensor_solar_radiation
    entity_id: ${ha_solar_radiation}
    on_value:
      then:
        - lambda: |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f", x);
            lv_label_set_text(id(lbl_solar), buf);

  # ---------------------------------------------------------------------------
  # Barometer — current pressure and trend
  # ---------------------------------------------------------------------------
  - platform: homeassistant
    id: sensor_pressure
    entity_id: ${ha_pressure}
    on_value:
      then:
        - lambda: |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f", x);
            lv_label_set_text(id(lbl_pressure), buf);
        - lvgl.arc.update:
            id: baro_gauge
            value: !lambda return (int)x;

  - platform: homeassistant
    id: sensor_pressure_trend_value
    entity_id: ${ha_pressure_trend_value}
    on_value:
      then:
        - lambda: |-
            const char* icon;
            lv_color_t color;
            char text_buf[16];
            if (x > 0) {
              icon = "${trend_rising}";
              color = lv_color_hex(${clr_trend_rising});
              snprintf(text_buf, sizeof(text_buf), "Stiger %.1f", x);
              for (char* p = text_buf; *p; p++) if (*p == '.') { *p = ','; break; }
            } else if (x < 0) {
              icon = "${trend_falling}";
              color = lv_color_hex(${clr_trend_falling});
              snprintf(text_buf, sizeof(text_buf), "Falder %.1f", -x);
              for (char* p = text_buf; *p; p++) if (*p == '.') { *p = ','; break; }
            } else {
              icon = "${trend_stable}";
              color = lv_color_hex(${clr_trend_stable});
              snprintf(text_buf, sizeof(text_buf), "Stabil");
            }
            lv_label_set_text(id(pressure_trend_symbol), icon);
            lv_obj_set_style_text_color(id(pressure_trend_symbol), color, 0);
            lv_label_set_text(id(pressure_trend_text), text_buf);

  # ---------------------------------------------------------------------------
  # Rain — today's total, current rate, yesterday's total
  # ---------------------------------------------------------------------------
  - platform: homeassistant
    id: sensor_rain_today
    entity_id: ${ha_rain_today}
    on_value:
      then:
        - lambda: |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%.1f", x);
            for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
            lv_label_set_text(id(rain_today), buf);

  - platform: homeassistant
    id: sensor_rain_rate
    entity_id: ${ha_rain_rate}
    on_value:
      then:
        - lambda: |-
            char buf[24];
            snprintf(buf, sizeof(buf), "%.1f #7788AA mm/t#", x);
            for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
            lv_label_set_text(id(lbl_rain_rate), buf);

  - platform: homeassistant
    id: sensor_rain_yesterday
    entity_id: ${ha_rain_yesterday}
    on_value:
      then:
        - lambda: |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f", x);
            for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
            lv_label_set_text(id(lbl_rain_yesterday), buf);

  # ---------------------------------------------------------------------------
  # Forecast — high and low temperatures
  # ---------------------------------------------------------------------------
  - platform: homeassistant
    id: sensor_fcst_precip_prob
    entity_id: ${ha_fcst_precip_prob}
    filters:
      - filter_out: nan
    on_value:
      then:
        - lambda: |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f%%", x);
            lv_label_set_text(id(lbl_fcst_precip_prob), buf);

  - platform: homeassistant
    id: sensor_fcst_precipitation
    entity_id: ${ha_fcst_precipitation}
    filters:
      - filter_out: nan
    on_value:
      then:
        - lambda: |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%.1f mm", x);
            for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
            lv_label_set_text(id(lbl_fcst_precipitation), buf);

  - platform: homeassistant
    id: sensor_fcst_temp_high
    entity_id: ${ha_fcst_temp_high}
    filters:
      - filter_out: nan
    on_value:
      then:
        - lambda: |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%.1f°", x);
            for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
            lv_label_set_text(id(lbl_fcst_high), buf);

  - platform: homeassistant
    id: sensor_fcst_temp_low
    entity_id: ${ha_fcst_temp_low}
    filters:
      - filter_out: nan
    on_value:
      then:
        - lambda: |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%.1f°", x);
            for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
            lv_label_set_text(id(lbl_fcst_low), buf);

  # ---------------------------------------------------------------------------
  # AQI — index value, PM2.5 and PM10 particulate matter
  # ---------------------------------------------------------------------------
  - platform: homeassistant
    id: sensor_aqi_index
    entity_id: ${ha_aqi_index}
    on_value:
      then:
        - lambda: |-
            auto aqi_color = [](int aqi) -> lv_color_t {
              if (aqi <= 50)  return lv_color_hex(${clr_wifi_good});   // 0–50   good              green
              if (aqi <= 100) return lv_color_hex(${clr_temp_cool});   // 51–100 moderate          yellow
              if (aqi <= 150) return lv_color_hex(${clr_temp_warm});   // 101–150 unhealthy (sens) orange
              if (aqi <= 200) return lv_color_hex(${clr_temp_hot});    // 151–200 unhealthy        red
              if (aqi <= 300) return lv_color_hex(0x9C27B0);           // 201–300 very unhealthy   violet
              return lv_color_hex(0x7E0023);                           // 301+    hazardous         maroon
            };
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f", x);
            lv_label_set_text(id(lbl_aqi), buf);
            lv_obj_set_style_border_color(id(circle_aqi), aqi_color((int)x), 0);

  # ---------------------------------------------------------------------------
  # Lightning — strike count (3h) and minimum distance (3h)
  # ---------------------------------------------------------------------------
  - platform: homeassistant
    id: sensor_lightning_strikes3h
    entity_id: ${ha_lightning_strikes3h}
    on_value:
      then:
        - lambda: |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f", x);
            lv_label_set_text(id(lbl_lightning_count), buf);

  - platform: homeassistant
    id: sensor_lightning_distance
    entity_id: ${ha_lightning_distance}
    filters:
      - filter_out: nan
    on_value:
      then:
        - lambda: |-
            char buf[12];
            snprintf(buf, sizeof(buf), "%.1f km", x);
            for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
            lv_label_set_text(id(lbl_lightning_distance), buf);


text_sensor:
  # ---------------------------------------------------------------------------
  # Forecast — condition code, short text, description
  # ---------------------------------------------------------------------------
  - platform: homeassistant
    id: ts_fcast_condition
    entity_id: ${ha_fcast_condition}
    on_value:
      then:
        - lambda: |-
            static lv_obj_t* all[] = {
              id(fimg_clear_day), id(fimg_clear_night), id(fimg_cloudy),
              id(fimg_fog), id(fimg_lightning), id(fimg_lightning_rainy),
              id(fimg_partlycloudy), id(fimg_rainy), id(fimg_snowy),
              id(fimg_snowy_rainy), id(fimg_windy)
            };
            for (auto* o : all) lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
            lv_obj_t* show = id(fimg_clear_day);
            if      (x == "clear-night")     show = id(fimg_clear_night);
            else if (x == "cloudy")          show = id(fimg_cloudy);
            else if (x == "fog")             show = id(fimg_fog);
            else if (x == "lightning")       show = id(fimg_lightning);
            else if (x == "lightning-rainy") show = id(fimg_lightning_rainy);
            else if (x == "partlycloudy")    show = id(fimg_partlycloudy);
            else if (x == "rainy")           show = id(fimg_rainy);
            else if (x == "snowy")           show = id(fimg_snowy);
            else if (x == "snowy-rainy")     show = id(fimg_snowy_rainy);
            else if (x == "windy")           show = id(fimg_windy);
            lv_obj_clear_flag(show, LV_OBJ_FLAG_HIDDEN);

  - platform: homeassistant
    id: ts_fcast_condition_txt
    entity_id: ${ha_fcast_condition_txt}
    on_value:
      then:
        - lambda: |-
            std::string txt = x;
            if      (x == "clear-night")     txt = "Klart, nat";
            else if (x == "cloudy")          txt = "Overskyet";
            else if (x == "exceptional")     txt = "Ekstremt vejr";
            else if (x == "fog")             txt = "Tåge";
            else if (x == "hail")            txt = "Hagl";
            else if (x == "lightning")       txt = "Tordenvejr";
            else if (x == "lightning-rainy") txt = "Torden og regn";
            else if (x == "partlycloudy")    txt = "Delvist skyet";
            else if (x == "pouring")         txt = "Silende regn";
            else if (x == "rainy")           txt = "Regn";
            else if (x == "snowy")           txt = "Sne";
            else if (x == "snowy-rainy")     txt = "Slud";
            else if (x == "sunny")           txt = "Solrigt";
            else if (x == "windy")           txt = "Blæsende";
            else if (x == "windy-variant")   txt = "Blæsende";
            lv_label_set_text(id(lbl_fcst_condition), txt.c_str());

  - platform: homeassistant
    id: ts_fcast_description
    entity_id: ${ha_fcast_description}
    on_value:
      then:
        - lambda: |-
            lv_label_set_text(id(lbl_fcst_description), x.c_str());

  # ---------------------------------------------------------------------------
  # Sunrise & Sunset Times
  # ---------------------------------------------------------------------------
  - platform: homeassistant
    id: ts_sunrise
    entity_id: ${ha_sunrise}
    on_value:
      then:
        - lambda: |-
            lv_label_set_text(id(lbl_sunrise), x.c_str());

  - platform: homeassistant
    id: ts_sunset
    entity_id: ${ha_sunset}
    on_value:
      then:
        - lambda: |-
            lv_label_set_text(id(lbl_sunset), x.c_str());

  # ---------------------------------------------------------------------------
  # Lightning — time of last detected strike
  # ---------------------------------------------------------------------------
  - platform: homeassistant
    id: ts_lightning_latest
    entity_id: ${ha_lightning_latest}
    on_value:
      then:
        - lambda: |-
            std::string txt = x;
            bool known = !(txt.empty() || txt == "unknown" || txt == "unavailable");

            // HA timestamp sensors report UTC ISO8601, e.g. "2026-07-22T13:45:00+00:00".
            // Normalize to the "YYYY-MM-DD HH:MM:SS" form ESPTime::strptime understands
            // and drop any fractional seconds / offset suffix.
            time_t parsed_epoch = 0;
            if (known && txt.size() >= 19) {
              std::string norm = txt.substr(0, 19);
              norm[10] = ' ';
              ESPTime t{};
              if (ESPTime::strptime(norm, t)) {
                t.recalc_timestamp_utc();
                parsed_epoch = t.timestamp;
              } else {
                known = false;
              }
            } else {
              known = false;
            }
            id(lightning_last_epoch) = known ? (int32_t) parsed_epoch : 0;
            id(lightning_relative_time_update).execute();

            // Skip the popup for the initial value pushed on boot/reconnect —
            // only a real change afterwards means a new strike happened.
            if (!id(lightning_seen_boot)) {
              id(lightning_seen_boot) = true;
              return;
            }
            if (!known) return;

            lv_label_set_text(id(lbl_popup_lightning_latest), lv_label_get_text(id(lbl_lightning_latest)));

            float cnt = id(sensor_lightning_strikes3h).state;
            char cbuf[8];
            if (!std::isnan(cnt)) snprintf(cbuf, sizeof(cbuf), "%.0f", cnt);
            else snprintf(cbuf, sizeof(cbuf), "--");
            lv_label_set_text(id(lbl_popup_lightning_count), cbuf);

            float dist = id(sensor_lightning_distance).state;
            char dbuf[12];
            if (!std::isnan(dist)) {
              snprintf(dbuf, sizeof(dbuf), "%.1f km", dist);
              for (char* p = dbuf; *p; p++) if (*p == '.') { *p = ','; break; }
            } else {
              snprintf(dbuf, sizeof(dbuf), "--");
            }
            lv_label_set_text(id(lbl_popup_lightning_distance), dbuf);

            lv_obj_clear_flag(id(lightning_popup), LV_OBJ_FLAG_HIDDEN);
            id(lightning_popup_hide).execute();

# ---------------------------------------------------------------------------
# Night mode — turn display off at configured time, on again at another time
# ---------------------------------------------------------------------------
number:
  - platform: template
    id: night_off_hour
    name: "Nat sluk - time"
    icon: "mdi:clock-outline"
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 22
    restore_value: true
    optimistic: true
  - platform: template
    id: night_off_minute
    name: "Nat sluk - minut"
    icon: "mdi:clock-outline"
    min_value: 0
    max_value: 59
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
  - platform: template
    id: night_on_hour
    name: "Nat tænd - time"
    icon: "mdi:clock-outline"
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 7
    restore_value: true
    optimistic: true
  - platform: template
    id: night_on_minute
    name: "Nat tænd - minut"
    icon: "mdi:clock-outline"
    min_value: 0
    max_value: 59
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true

globals:
  - id: night_wake_active
    type: bool
    initial_value: 'false'
  - id: lightning_seen_boot
    type: bool
    initial_value: 'false'
  - id: lightning_last_epoch
    type: int
    initial_value: '0'

script:
  - id: lightning_relative_time_update
    then:
      - lambda: |-
          if (id(lightning_last_epoch) == 0) {
            lv_label_set_text(id(lbl_lightning_latest), "--");
            return;
          }
          long elapsed = (long)(id(system_time).now().timestamp - id(lightning_last_epoch));
          if (elapsed < 0) elapsed = 0;
          char buf[16];
          if (elapsed < 60)          snprintf(buf, sizeof(buf), "%ld s", elapsed);
          else if (elapsed < 3600)   snprintf(buf, sizeof(buf), "%ld min", elapsed / 60);
          else if (elapsed < 86400)  snprintf(buf, sizeof(buf), "%ld t", elapsed / 3600);
          else                       snprintf(buf, sizeof(buf), "%ld d", elapsed / 86400);
          lv_label_set_text(id(lbl_lightning_latest), buf);

  - id: night_mode_sleep_timer
    mode: restart
    then:
      - globals.set:
          id: night_wake_active
          value: 'true'
      - switch.turn_on: backlight
      - delay: 2min
      - globals.set:
          id: night_wake_active
          value: 'false'
      - script.execute: night_mode_check

  - id: night_mode_check
    mode: single
    then:
      - lambda: |-
          if (!id(night_mode_switch).state) return;
          auto t = id(system_time).now();
          if (!t.is_valid()) return;
          int now_min = t.hour * 60 + t.minute;
          int off_min = (int)id(night_off_hour).state * 60 + (int)id(night_off_minute).state;
          int on_min  = (int)id(night_on_hour).state  * 60 + (int)id(night_on_minute).state;
          bool in_night = (off_min > on_min)
            ? (now_min >= off_min || now_min < on_min)
            : (now_min >= off_min && now_min < on_min);
          if (in_night) {
            if (!id(night_wake_active)) id(backlight).turn_off();
          } else if (!id(backlight).state) {
            id(backlight).turn_on();
          }

packages:
  remote_package_files:
    url: https://git.digitalhomes.dk/briis/esphome-weather
    files:
      - weather-common.yaml
    ref: main
    username: briis
    password: !secret forgejo_token
    refresh: 10s
