# ============================================================
# Weather Display — ESP32-S3 hardware target
# Waveshare ESP32-S3-Touch-LCD-7  800×480
# ESP32-S3, 16 MB flash, 8 MB octal PSRAM
#
# Flash:
#   esphome run weatherdisplay.yaml
# ============================================================
substitutions:
  name: "Weather Display"
  device: "weatherdisplay"
  version: "0.1.0"
  created_by: "Bjarne Riis"

esphome:
  name: "${device}"
  friendly_name: "${name}"
  project:
    name: "briis.${device}"
    version: "${version}"
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio

# ---------------------------------------------------------------------------
# ESP32-S3 — esp-idf required for mipi_rgb display support
# ---------------------------------------------------------------------------
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_LINE_SIZE: "64"

psram:
  mode: octal
  speed: 80MHz

# ---------------------------------------------------------------------------
# Connectivity
# ---------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "WeatherDisplay Fallback"

api:
  encryption:
    key: !secret ha_api_key

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      then:
        switch.turn_off: backlight

captive_portal:

logger:
  level: INFO

# ---------------------------------------------------------------------------
# Hardware — I/O expander, display, touch, backlight
# ---------------------------------------------------------------------------
i2c:
  - id: i2c_touch_bus
    sda: GPIO8
    scl: GPIO9
    scan: true
    frequency: 400kHz

ch422g:
  id: io_ex

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: lvgl_display
    auto_clear_enabled: false
    update_interval: never
    color_order: RGB
    pclk_frequency: 16MHz
    dimensions:
      width: 800
      height: 480
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin:
      number: 7
    reset_pin:
      ch422g: io_ex
      number: 3
    enable_pin:
      ch422g: io_ex
      number: 2
      allow_other_uses: true
    pclk_inverted: true
    hsync_back_porch: 30
    hsync_front_porch: 210
    hsync_pulse_width: 30
    vsync_back_porch: 4
    vsync_front_porch: 4
    vsync_pulse_width: 4
    data_pins:
      red:
        - 1        # r3
        - 2        # r4
        - 42       # r5
        - 41       # r6
        - 40       # r7
      blue:
        - 14       # b3
        - 38       # b4
        - 18       # b5
        - 17       # b6
        - 10       # b7
      green:
        - 39       # g2
        - 0        # g3
        - 45       # g4
        - 48       # g5
        - 47       # g6
        - 21       # g7

touchscreen:
  platform: gt911
  id: touch_controller
  display: lvgl_display
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: io_ex
    number: 1
    mode: output
  on_touch:
    then:
      - if:
          condition:
            - lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - if:
          condition:
            switch.is_off: backlight
          then:
            - switch.turn_on: backlight

switch:
  - platform: gpio
    id: backlight
    name: "Baggrundslys"
    pin:
      ch422g: io_ex
      number: 2
      allow_other_uses: true
      mode:
        output: true
      inverted: false
    restore_mode: ALWAYS_ON

packages:
  remote_package_files:
    url: https://git.digitalhomes.dk/briis/esphome-weather
    files: 
      - weatherdisplay-common.yaml
    ref: main
    username: briis
    password: !secret forgejo_token
    refresh: 10s
