# ============================================================
# Weather Display — SDL Simulator target
# 800×480 LVGL v9 — host platform for layout iteration
#
# Prerequisites (macOS):
#   brew install sdl2
#   pip install esphome
#
# Run:
#   esphome run weatherdisplay-sdl.yaml
# ============================================================

esphome:
  name: weatherdisplay-sdl
  friendly_name: Weather Display SDL
  on_boot:
    priority: -100.0
    then:
      - lvgl.label.update:
          id: lbl_time
          text: !lambda |-
            time_t now = ::time(nullptr);
            struct tm *t = localtime(&now);
            char buf[6];
            strftime(buf, sizeof(buf), "%H:%M", t);
            return std::string(buf);
      - lambda: |-
          static const char* icons[] = {
            "\U000F092B", "\U000F091F", "\U000F0922", "\U000F0925", "\U000F0928"
          };
          static uint32_t colors[] = {
            ${clr_wifi_bad}, ${clr_wifi_bad}, ${clr_wifi_weak}, ${clr_wifi_good}, ${clr_wifi_good}
          };
          srand(::time(nullptr));
          int lvl = rand() % 5;
          lv_label_set_text(id(lbl_wifi), icons[lvl]);
          lv_obj_set_style_text_color(id(lbl_wifi), lv_color_hex(colors[lvl]), 0);
      - lambda: |-
          // Mock temperature data for SDL visual testing
          auto fmt = [](char* buf, int n, float v) {
            snprintf(buf, n, "%.1f°", v);
            for (char* p = buf; *p; p++) if (*p == '.') { *p = ','; break; }
          };
          char buf[12];
          float temp = 12.5f;
          fmt(buf, sizeof(buf), temp);
          lv_label_set_text(id(lbl_temp_current), buf);
          lv_obj_set_style_border_color(id(circle_temp), lv_color_hex(${clr_temp_cool}), 0);
          fmt(buf, sizeof(buf), 18.3f);
          lv_label_set_text(id(lbl_temp_high), buf);
          fmt(buf, sizeof(buf), 5.2f);
          lv_label_set_text(id(lbl_temp_low), buf);
      - lvgl.arc.update:
          id: arc_wind_current
          start_angle: 314
          end_angle: 330
          value: 100
      - lvgl.arc.update:
          id: arc_wind_avg
          start_angle: 307
          end_angle: 323
          value: 100
      - lambda: |-
          lv_obj_set_style_arc_opa(id(arc_wind_current), LV_OPA_TRANSP, LV_PART_MAIN);
          lv_obj_set_style_arc_opa(id(arc_wind_avg), LV_OPA_TRANSP, LV_PART_MAIN);
          lv_obj_set_style_opa(id(arc_wind_current), LV_OPA_TRANSP, LV_PART_KNOB);
          lv_obj_set_style_opa(id(arc_wind_avg), LV_OPA_TRANSP, LV_PART_KNOB);
          lv_label_set_text(id(lbl_wind_info), "NØ 52°");
          lv_label_set_text(id(lbl_wind_speed), "3,2");
          lv_label_set_text(id(lbl_wind_gust), "Stød 5,1");

host:

logger:
  level: INFO

display:
  - platform: sdl
    id: lvgl_display
    dimensions:
      width: 800
      height: 480
    update_interval: 16ms

interval:
  - interval: 30s
    then:
      - lambda: |-
          static const char* icons[] = {
            "\U000F092B", "\U000F091F", "\U000F0922", "\U000F0925", "\U000F0928"
          };
          static uint32_t colors[] = {
            ${clr_wifi_bad}, ${clr_wifi_bad}, ${clr_wifi_weak}, ${clr_wifi_good}, ${clr_wifi_good}
          };
          int lvl = rand() % 5;
          lv_label_set_text(id(lbl_wifi), icons[lvl]);
          lv_obj_set_style_text_color(id(lbl_wifi), lv_color_hex(colors[lvl]), 0);

packages:
  common: !include weatherdisplay-common.yaml
